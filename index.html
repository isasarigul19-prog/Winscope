<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinScope | Maç Önü Analiz</title>
<style>
:root{--bg:#04191e;--p:#08272d;--p2:#0c343b;--line:#15505a;--t:#f1fbfc;--m:#9bb9bf;--pink:#ff2f63;--green:#42e6a0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#031419,#073038 65%,#04191e);color:var(--t);font:14px system-ui,sans-serif}
header{padding:16px;max-width:1050px;margin:auto;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-weight:950;letter-spacing:.08em;font-size:25px}.logo span{font-size:13px;color:var(--pink);margin-left:4px;font-weight:700}
.small,.sub{color:var(--m);font-size:12px;line-height:1.45}main{max-width:1050px;margin:auto;padding:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
button{cursor:pointer}.primary,.active{background:var(--pink);border-color:var(--pink);font-weight:800}
.panel,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--p),#062126);padding:13px;margin:12px 0}
.head{display:flex;justify-content:space-between;color:var(--m);font-size:12px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:17px 0}
.team{font-weight:850;font-size:17px;overflow-wrap:anywhere}.team:last-child{text-align:right}
.score{font-weight:950;font-size:26px;white-space:nowrap}.table{width:100%;border-spacing:0 5px}.table td{background:#06242a;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.table td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px;color:var(--m)}
.table td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0;font-weight:800}
.hidden{display:none!important}.empty{padding:18px;text-align:center;color:var(--m)}.err{color:#ff9baa}
#matchSearch{flex:1;min-width:180px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 8px;color:var(--green);font-size:11px}
@media(max-width:500px){.team{font-size:14px}.score{font-size:22px}header{padding:12px}}
</style>
</head>
<body>
<header>
  <div><div class="logo">WINSCOPE <span>PREMATCH</span></div><div class="sub">Canlı maçlar listelenir · Analiz yalnızca maç önü oranlarıyla yapılır</div></div>
  <div class="small" id="conn">BAĞLANIYOR</div>
</header>
<main>
  <div class="toolbar">
    <button class="primary" id="refresh">↻ Canlı maçlar</button>
    <input id="date" type="date">
    <button id="bulletin">Bülten</button>
    <button id="showTracking">Tahmin Takibi</button>
    <select id="filter"><option value="all">Tüm maçlar</option><option value="live">Canlı</option></select>
  </div>
  <section class="panel" id="matchSearchPanel">
    <h3 style="margin:2px 0 8px">🔎 1’e 1 MAÇ ARA</h3>
    <div class="toolbar" style="margin:0"><input id="matchSearch" type="search" placeholder="Takım adı: Fenerbahçe, Barcelona…"><button id="searchMatch" class="primary">Maç Ara</button><button id="clearMatchSearch">Temizle</button></div>
    <div id="matchSearchResult" class="small" style="margin-top:8px">Aramak için takım adını yaz.</div>
  </section>
  <section class="panel" id="couponPanel">
    <h3 style="margin:2px 0 10px">🎯 WINSCOPE KUPONLARI</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="makeCoupon" class="primary">⚽ Maç Önü Kuponu</button>
      <button id="makeSurpriseCoupon">🎲 Sürpriz Kupon (10 maça kadar)</button>
    </div>
    <div id="couponResult" class="small" style="margin-top:12px"></div>
  </section>
  <div id="msg" class="small"></div>
  <section class="panel hidden" id="trackingPanel"><div class="head"><b>📊 Canlı Tercih Sonuç Takibi</b><button id="hideTracking">Kapat</button></div><div id="trackingResults" class="small">Sonuçlar yükleniyor…</div></section>
  <section id="matches"><div class="empty">Maçlar yükleniyor…</div></section>
</main>
<script>
const $=x=>document.getElementById(x);
let matches=[],bulletinMatches=[],viewMode='live';
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(m){
  const live=String(m.status||'').toUpperCase()==='LIVE';
  return `<article class="card" id="m${Number(m.id)}">
    <div class="head"><span>${esc(m.country)} · ${esc(m.league)}</span><span>${live?'<span class="pill">CANLI · SADECE LİSTE</span>':esc(m.status||'MAÇ ÖNÜ')} ${m.minute!=null&&live?esc(m.minute)+"'":''}</span></div>
    <div class="teams"><div class="team">${esc(m.home)}</div><div class="score">${live?`${esc(m.homeScore)} : ${esc(m.awayScore)}`:'VS'}</div><div class="team">${esc(m.away)}</div></div>
    <div class="toolbar"><button class="primary" onclick="analyze(${Number(m.id)})">MAÇ ÖNÜ ANALİZİ</button></div>
    <div id="a${Number(m.id)}"><div class="empty">Maç önü analizi için dokun.</div></div>
  </article>`;
}
function currentList(){return $('filter').value==='live'?matches.filter(m=>String(m.status||'').toUpperCase()==='LIVE'):(viewMode==='live'?matches:bulletinMatches)}
function renderList(list){$('matches').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Maç bulunamadı.</div>'}
async function live(){
  viewMode='live';$('conn').textContent='MAÇLAR YÜKLENİYOR';
  try{const r=await fetch('/api/live');const j=await r.json();if(!r.ok)throw Error(j.error||'Canlı maçlar alınamadı');matches=j.matches||[];$('conn').textContent='SUNUCU BAĞLI';renderList(currentList())}
  catch(e){$('conn').textContent='BAĞLANTI HATASI';$('matches').innerHTML=`<div class="empty err">${esc(e.message)}</div>`}
}
async function bulletin(){
  const d=$('date').value;if(!d){$('msg').textContent='Önce tarih seç.';return}
  viewMode='bulletin';$('msg').textContent='Bülten yükleniyor…';
  try{const r=await fetch('/api/fixtures?date='+encodeURIComponent(d));const j=await r.json();if(!r.ok)throw Error(j.error||'Bülten alınamadı');bulletinMatches=j.matches||[];$('msg').textContent=`${bulletinMatches.length} maç listelendi.`;renderList(currentList())}
  catch(e){$('msg').textContent=e.message}
}
async function searchMatch(){
 const q=$('matchSearch').value.trim().toLocaleLowerCase('tr-TR'),out=$('matchSearchResult');
 if(!q){out.innerHTML='<span class="err">Önce takım adı yaz.</span>';return}
 const d=$('date').value;
 try{
  if(viewMode!=='bulletin'||!bulletinMatches.length){if(!d){out.innerHTML='<span class="err">Önce tarih seç.</span>';return}const r=await fetch('/api/fixtures?date='+encodeURIComponent(d));const j=await r.json();bulletinMatches=j.matches||[];viewMode='bulletin'}
  const found=bulletinMatches.filter(m=>`${m.home||''} ${m.away||''}`.toLocaleLowerCase('tr-TR').includes(q));
  renderList(found);out.textContent=found.length?`${found.length} maç bulundu.`:'Eşleşen maç bulunamadı.';
 }catch(e){out.innerHTML=`<span class="err">${esc(e.message)}</span>`}
}
async function analyze(id){
 const box=$('a'+id);box.innerHTML='<div class="empty">Maç önü oranları ve takım formu değerlendiriliyor…</div>';
 try{
  const r=await fetch(`/api/match/${id}/analyze`),j=await r.json();if(!r.ok)throw Error(j.error||'Analiz alınamadı');
  window.analysisPayloads=window.analysisPayloads||{};window.analysisPayloads[id]=j;
  box.innerHTML=`<table class="table">
   <tr><td>Analiz türü</td><td>Maç önü oranları (canlı oran yok)</td></tr>
   <tr><td>İY SKOR TAHMİNİ</td><td>${esc(j.halfTimeScore)}</td></tr>
   <tr><td>MS SKOR TAHMİNİ</td><td>${esc(j.fullTimeScore)}</td></tr>
   <tr><td>ALTERNATİF SKOR</td><td>${esc(j.alternativeFullTimeScore||'Alternatif skor hesaplanamadı')}</td></tr>
   <tr><td>ANA TERCİH</td><td>${esc(j.mainPick)}</td></tr>
   <tr><td>ALTERNATİF</td><td>${esc(j.alternative)}</td></tr>
   <tr><td>CANLI TERCİH</td><td>Devre dışı</td></tr>
  </table><div class="small" style="margin-top:8px">${esc(j.scoreBasis||'')} · ${esc(j.note||'')}</div><div class="toolbar"><button onclick="approveAnalysis(${Number(id)})" class="primary">Analizi Onayla ve Sonuç Takibine Al</button></div>`;
 }catch(e){box.innerHTML=`<div class="small err">${esc(e.message)}</div>`}
}

async function approveAnalysis(id){
 const analysis=(window.analysisPayloads||{})[id];
 const match=[...matches,...bulletinMatches].find(m=>Number(m.id)===Number(id));
 if(!match){$('msg').textContent='Maç bilgisi bulunamadı; önce bülteni veya canlı listeyi yenile.';return}
 try{
  const r=await fetch('/api/analyses/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fixtureId:Number(id),home:match.home,away:match.away,matchDate:match.fixtureDate||'',analysis})});
  const j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Analiz kaydedilemedi');
  $('msg').textContent='Analiz kaydedildi ve maç sonucu takibine alındı.';
 }catch(e){$('msg').textContent='Kayıt hatası: '+e.message}
}
async function showTracking(){
 const panel=$('trackingPanel');panel.classList.remove('hidden');$('trackingResults').textContent='Canlı tercih sonuçları yükleniyor…';
 try{
  const r=await fetch('/api/live-goal-predictions?limit=100');const j=await r.json();if(!r.ok)throw Error(j.error||'Takip bilgisi alınamadı');
  const pct=v=>v==null?'—':`${v}%`;
  const statusLabel=s=>({pending:'BEKLİYOR',won:'KAZANDI',lost:'KAYBETTİ',void:'İPTAL / HESAPLANMADI'}[s]||s||'—');
  const statusColor=s=>s==='won'?'var(--green)':s==='lost'?'var(--pink)':'var(--m)';
  $('trackingResults').innerHTML=`<div class="statteam"><b>Otomatik gönderilen canlı tercihler</b>
   <div class="statline"><span>Toplam kayıt</span><b>${esc(j.total||0)}</b></div>
   <div class="statline"><span>Sonuçlanan</span><b>${esc(j.settled||0)}</b></div>
   <div class="statline"><span>Bekleyen</span><b>${esc(j.pending||0)}</b></div>
   <div class="statline"><span>✅ Kazandı</span><b>${esc(j.wins||0)}</b></div>
   <div class="statline"><span>❌ Kaybetti</span><b>${esc(j.losses||0)}</b></div>
   <div class="statline"><span>İptal / ölçülemedi</span><b>${esc(j.void||0)}</b></div>
   <div class="statline"><span><b>Kazanma yüzdesi</b></span><b style="color:var(--green);font-size:18px">${esc(pct(j.hitRate))}</b></div>
   <div class="small">Yüzde yalnızca sonucu kesinleşen kazanılan + kaybedilen tercihlerden hesaplanır; bekleyen ve iptal edilenler paydaya girmez.</div>
   <div class="small">${esc(j.note||'')}</div></div>`+
   ((j.results||[]).length?(j.results||[]).map(x=>`<div class="statteam"><b>${esc(x.home)} VS ${esc(x.away)}</b>
    <div class="statline"><span>Tercih</span><b>${esc(x.market)}</b></div>
    <div class="statline"><span>Tercih anı</span><b>${esc(x.minute)}' · ${esc(x.scoreAtPick)}</b></div>
    <div class="statline"><span>Sonuç</span><b style="color:${statusColor(x.status)}">${esc(statusLabel(x.status))}</b></div>
    ${x.finalScore?`<div class="statline"><span>Maç sonucu</span><b>${esc(x.finalScore)}</b></div>`:''}
    <div class="small">${esc(x.league||'')} · ${esc(x.oddsSource||'')}</div></div>`).join(''):'<div class="empty">Henüz kaydedilmiş otomatik canlı tercih yok. İlk tercih gönderildiğinde burada görünür.</div>');
 }catch(e){$('trackingResults').textContent='Takip bilgisi alınamadı: '+e.message}
}

function renderCoupon(d){
 const box=$('couponResult');
 if(d.status==='ERROR'||d.error){box.innerHTML=`<div class="err"><b>${esc(d.error||'Kupon oluşturulamadı.')}</b></div>`;return}
 if(!d.picks||!d.picks.length){box.innerHTML='<div class="err">Uygun maç/tercih bulunamadı.</div>';return}
 box.innerHTML=`<div class="head"><span>Kupon: <b>${esc(String(d.type||'maç önü').toUpperCase())}</b></span></div><div style="margin:10px 0">${d.picks.map(p=>`<div style="padding:7px;border-bottom:1px solid var(--line)"><b>${esc(p.home)} VS ${esc(p.away)}</b><br>Tercih: <u>${esc(p.market)}</u></div>`).join('')}</div>`;
}
$('refresh').onclick=live;$('bulletin').onclick=bulletin;$('searchMatch').onclick=searchMatch;$('showTracking').onclick=showTracking;$('hideTracking').onclick=()=> $('trackingPanel').classList.add('hidden');
$('matchSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchMatch()});
$('clearMatchSearch').onclick=()=>{$('matchSearch').value='';$('matchSearchResult').textContent='Aramak için takım adını yaz.'};
$('makeCoupon').onclick=async()=>{try{const r=await fetch('/api/coupon/best?date='+encodeURIComponent($('date').value));renderCoupon(await r.json())}catch(e){$('couponResult').textContent=e.message}};
$('makeSurpriseCoupon').onclick=async()=>{try{const r=await fetch('/api/coupon/surprise?date='+encodeURIComponent($('date').value));renderCoupon(await r.json())}catch(e){$('couponResult').textContent=e.message}};
$('filter').onchange=()=>renderList(currentList());
const d=new Date();$('date').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;live();
</script>
</body></html>
