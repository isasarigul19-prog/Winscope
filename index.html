<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinScope Live</title><style>
:root{--bg:#04191e;--p:#08272d;--p2:#0c343b;--line:#15505a;--t:#f1fbfc;--m:#9bb9bf;--pink:#ff2f63;--green:#42e6a0;--amber:#ffd04a;--gray:#7f9da3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#031419,#073038 65%,#04191e);color:var(--t);font:14px system-ui,sans-serif}header{padding:16px;max-width:1050px;margin:auto;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-weight:950;letter-spacing:.08em;font-size:25px}.logo span{font-size:13px;color:var(--pink);margin-left:4px;font-weight:700}.small,.sub{color:var(--m);font-size:12px;line-height:1.45}main{max-width:1050px;margin:auto;padding:12px}.toolbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}button{cursor:pointer}.primary,.active{background:var(--pink);border-color:var(--pink);font-weight:800}.panel,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--p),#062126);padding:13px;margin:12px 0}.head{display:flex;justify-content:space-between;color:var(--m);font-size:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:17px 0}.team{font-weight:850;font-size:17px;overflow-wrap:anywhere}.team:last-child{text-align:right}.score{font-weight:950;font-size:26px;white-space:nowrap}.meta{text-align:center;color:var(--m);font-size:11px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#062126;border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0}.tabs button{border:0;background:transparent}.tabs button.active{background:var(--pink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{width:100%;border-spacing:0 5px}.table td{background:#06242a;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px;color:var(--m)}.table td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0;font-weight:800}.group{border:1px solid var(--line);border-radius:11px;padding:8px}.gt{font-size:12px;font-weight:850;margin:4px 3px 8px}.bar{display:grid;grid-template-columns:75px 1fr 40px;gap:7px;align-items:center;font-size:12px;padding:5px 0}.track{height:11px;border-radius:20px;background:#193d44;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:20px}.fill.amber{background:var(--amber)}.fill.gray{background:var(--gray)}.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.odd{border:1px solid var(--line);background:#0a3037;border-radius:11px;padding:9px;text-align:center;overflow-wrap:anywhere}.odd label{display:block;color:var(--m);font-size:11px}.odd strong{display:block;font-size:18px}.hidden{display:none!important}.empty{padding:18px;text-align:center;color:var(--m)}.err{color:#ff9baa}.statteam{padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.statline{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #123a41}@media(max-width:650px){.grid{grid-template-columns:1fr}.odds{grid-template-columns:repeat(2,minmax(0,1fr))}.team{font-size:14px}.score{font-size:23px}}
#matchSearch{flex:0 1 220px!important;min-width:120px!important;max-width:260px}#searchMatch,#clearMatchSearch{padding:8px 10px;font-size:12px}@media(max-width:650px){#matchSearchPanel .toolbar{gap:6px}#matchSearch{max-width:none;flex:1 1 150px!important}}
.hidden{display:none!important}.archive-list{display:grid;gap:9px}.archive-item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#06242a}.archive-item .title{font-weight:850;margin-bottom:7px}.archive-item .rowline{display:flex;justify-content:space-between;gap:8px;padding:4px 0}.archive-item .rowline span{color:var(--m)}.archive-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.archive-actions button{padding:7px 10px}</style></head><body><header><div><div class="logo">WINSCOPE <span>LIVE</span></div><div class="sub">Canlı futbol analiz ve alarm sistemi</div></div><div class="small" id="conn">BAĞLANIYOR</div></header><main><div class="toolbar"><button class="primary" id="refresh">↻ Canlı maçlar</button><input id="date" type="date"><button id="bulletin">Bülten</button><button id="showAnalyses">Günün Analizleri</button><button id="showCoupons">Günün Kuponları</button><select id="filter"><option value="all">Tüm maçlar</option><option value="live">Canlı</option></select></div><section class="panel" id="matchSearchPanel"><h3 style="margin:2px 0 8px">🔎 1’e 1 MAÇ ARA</h3><div class="toolbar" style="margin:0"><input id="matchSearch" type="search" placeholder="Takım adı: Fenerbahçe, Barcelona…" style="flex:1;min-width:180px"><button id="searchMatch" class="primary">Maç Ara</button><button id="clearMatchSearch">Temizle</button></div><div id="matchSearchResult" class="small" style="margin-top:8px">Aramak için takım adını yaz.</div></section><section class="panel" id="couponPanel"><h3 style="margin:2px 0 10px">🎯 WINSCOPE KUPONLARI</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="makeCoupon" class="primary">⚽ Maç Önü Kuponu (En az 2 maç)</button><button id="makeLiveBest" style="background:#42e6a0;color:#04191e;font-weight:900;border:none">⚡ Canlı En Güvenilir Tek Tercih</button></div><div id="couponResult" class="small" style="margin-top:12px"></div></section><section class="panel hidden" id="analysesArchive"><div class="head"><h3>📋 Günün Analizleri</h3><button onclick="closeArchives()">Kapat</button></div><div id="analysesArchiveList" class="archive-list">Yükleniyor…</div></section><section class="panel hidden" id="couponsArchive"><div class="head"><h3>🎟️ Günün Kuponları</h3><button onclick="closeArchives()">Kapat</button></div><div id="couponsArchiveList" class="archive-list">Yükleniyor…</div></section><div id="msg" class="small"></div><section id="matches"><div class="empty">Maçlar yükleniyor…</div></section></main><script>
const $=x=>document.getElementById(x);let matches=[],bulletinMatches=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function bar(label,v,cls=''){if(v==null||!Number.isFinite(Number(v)))return `<div class="bar"><span>${esc(label)}</span><div class="track"></div><b>—</b></div>`;v=Math.max(0,Math.min(100,Number(v)));return `<div class="bar"><span>${esc(label)}</span><div class="track"><div class="fill ${cls}" style="width:${v}%"></div></div><b>${v.toFixed(1)}%</b></div>`}
function card(m){return `<article class="card" id="m${Number(m.id)}"><div class="head"><span>${esc(m.country||'')} · ${esc(m.league||'')}</span><span>${esc(m.status==='NS'?'BAŞLAMADI':(m.status==='FT'?'MAÇ BİTTİ':m.status||''))}${m.minute!=null&&!['NS','FT'].includes(m.status)?' · '+esc(m.minute)+"'":''}</span></div><div class="teams"><div class="team">${esc(m.home)}</div><div class="score">${esc(m.homeScore??'–')} : ${esc(m.awayScore??'–')}</div><div class="team">${esc(m.away)}</div></div><div class="meta">${m.fixtureDate?new Date(m.fixtureDate).toLocaleString('tr-TR'):''}</div><div class="tabs"><button class="active" onclick="analyze(${Number(m.id)},'${m.status==='NS'?'prematch':'live'}')">MAÇ ANALİZİ</button><button onclick="stats(${Number(m.id)})">İSTATİSTİK</button></div><div id="a${Number(m.id)}"><div class="empty">Maç analizi için dokun.</div></div><div id="s${Number(m.id)}" class="hidden"></div></article>`}function render(){let a=$('filter').value==='live'?matches.filter(m=>!['FT','AET','PEN','NS'].includes(m.status)):matches;$('matches').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Bu listede maç bulunamadı.</div>'}async function live(){ $('matches').innerHTML='<div class="empty">Canlı maçlar yükleniyor…</div>';try{let r=await fetch('/api/live'),j=await r.json();if(!r.ok)throw Error(j.detail||j.error);matches=j.matches||[];$('conn').textContent='SUNUCU BAĞLI';$('msg').textContent=`${matches.length} maç · ${new Date(j.fetchedAt||Date.now()).toLocaleTimeString('tr-TR')}`;render()}catch(e){$('conn').textContent='HATA';$('msg').innerHTML=`<span class="err">${esc(e.message)}</span>`;$('matches').innerHTML='<div class="empty">Maçlar alınamadı.</div>'}}async function bulletin(){let d=$('date').value;if(!d)return;try{let r=await fetch('/api/fixtures?date='+encodeURIComponent(d)),j=await r.json();if(!r.ok)throw Error(j.detail||j.error);bulletinMatches=j.matches||[];$('matches').innerHTML=bulletinMatches.length?bulletinMatches.map(card).join(''):'<div class="empty">Maç bulunamadı.</div>';$('msg').textContent=`${bulletinMatches.length} maç · ${d}`}catch(e){$('msg').innerHTML=`<span class="err">${esc(e.message)}</span>`}}async function searchMatch(){const q=$('matchSearch').value.trim().toLocaleLowerCase('tr-TR');const out=$('matchSearchResult');if(!q){out.innerHTML='<span class="err">Önce bir takım adı yaz kral.</span>';return}const d=$('date').value;if(!d){out.innerHTML='<span class="err">Önce tarih seç.</span>';return}out.textContent='Bültendeki maçlar aranıyor…';$('searchMatch').disabled=true;try{let source=bulletinMatches;if(!source.length||!source.some(m=>String(m.fixtureDate||'').slice(0,10)===d)){const r=await fetch('/api/fixtures?date='+encodeURIComponent(d),{signal:AbortSignal.timeout(20000)});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||'Bülten alınamadı');source=j.matches||[];bulletinMatches=source}const found=source.filter(m=>`${m.home||''} ${m.away||''}`.toLocaleLowerCase('tr-TR').includes(q));if(!found.length){out.textContent=`“${$('matchSearch').value.trim()}” için ${d} bülteninde maç bulunamadı.`;return}matches=source;$('filter').value='all';$('matches').innerHTML=found.map(card).join('');out.textContent=`${found.length} eşleşen maç bulundu · ${d}. Analiz veya istatistik için maça dokun.`;$('msg').textContent=`Arama sonucu: ${found.length} maç · ${d}`;$('matches').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){out.innerHTML=`<span class="err">Arama başarısız: ${esc(e.message)}</span>`}finally{$('searchMatch').disabled=false}}function clearMatchSearch(){$('matchSearch').value='';$('matchSearchResult').textContent='Aramak için takım adını yaz.';bulletinMatches=[]}
async function analyze(id,mode){let box=$('a'+id);box.innerHTML='<div class="empty">Analiz ediliyor…</div>';try{let r=await fetch(`/api/match/${id}/analyze?mode=${mode}`),j=await r.json();if(!r.ok)throw Error(j.detail||j.error);let p=j.marketPercentages||{};const pct=(key)=>{const x=p[key];return x&&x.percent!=null&&Number.isFinite(Number(x.percent))?`%${esc(x.percent)} <span class="small">(${esc(x.source||'Kaynak belirtilmedi')} · son 5 maç örneklemi: ${esc(x.sampleSize||0)})</span>`:'Veri yok'};box.innerHTML=`<div class="grid"><div><table class="table"><tr><td>ANA TERCİH</td><td>${esc(j.mainPick||'—')}</td></tr><tr><td>ALTERNATİF</td><td>${esc(j.alternative||'—')}</td></tr><tr><td>İY SKOR</td><td>${esc(j.halfTimeScore||'—')}</td></tr><tr><td>MS SKOR</td><td>${esc(j.fullTimeScore||'—')}</td></tr><tr><td>CANLI TERCİH</td><td>${esc(j.livePick||'—')}</td></tr><tr><td>İY 0.5 ÜST</td><td>${pct('ht05')}</td></tr><tr><td>İY 1.5 ÜST</td><td>${pct('ht15')}</td></tr><tr><td>EV 1.5 ÜST</td><td>${pct('home15')}</td></tr><tr><td>DEP 1.5 ÜST</td><td>${pct('away15')}</td></tr><tr><td>MS 0.5 ÜST</td><td>${pct('ms05')}</td></tr><tr><td>MS 1.5 ÜST</td><td>${pct('ms15')}</td></tr><tr><td>MS 2.5 ÜST</td><td>${pct('ms25')}</td></tr><tr><td>MS 3.5 ÜST</td><td>${pct('ms35')}</td></tr><tr><td>KG VAR</td><td>${pct('btts')}</td></tr><tr><td>YÜZDE VERİSİ</td><td>API-Football gerçek tamamlanmış maçlar.</td></tr></table></div></div><div class="small" style="margin-top:8px">${esc(j.note||'Analiz notu yok.')}</div><div class="toolbar"><button class="primary" onclick="approveAnalysis(${id},'${mode}')">Analizi Onayla ve Kaydet</button></div>`}catch(e){box.innerHTML=`<div class="small err">${esc(e.message)}</div>`}}
async function stats(id){let b=$('s'+id);b.classList.remove('hidden');b.innerHTML='<div class="empty">İstatistik yükleniyor…</div>';try{let r=await fetch(`/api/match/${id}/stats`),j=await r.json();if(!r.ok)throw Error(j.error||'İstatistik alınamadı');let list=j.stats||[];if(!list.length){b.innerHTML='<div class="panel">İstatistik verisi bulunamadı.</div>';return;}b.innerHTML=`<div class="panel"><h3>İSTATİSTİK</h3>${list.map(t=>{let name=t.team?.name||t.team||'Takım';let stList=Array.isArray(t.statistics)?t.statistics:(typeof t.statistics==='object'?Object.entries(t.statistics).map(([type,value])=>({type,value})):[]);return `<div class="statteam"><b>${esc(name)}</b>${stList.map(s=>`<div class="statline"><span>${esc(s.type||'')}</span><b>${esc(s.value??'-')}</b></div>`).join('')}</div>`}).join('')}</div>`}catch(e){b.innerHTML=`<div class="small err">${esc(e.message)}</div>`}}
function renderCoupon(d){const box=$('couponResult');if(d.status==='ERROR'||d.error){box.innerHTML=`<div class="err"><b>${esc(d.error||'Kupon oluşturulamadı.')}</b><div>${esc(d.detail||'')}</div></div>`;return;}if(d.status==='NO_MATCHES'||!d.picks||!d.picks.length){box.innerHTML=`<div class="err"><b>${esc(d.message||'Yeterli sayıda doğrulanabilir oranlı maç bulunamadı.')}</b><div>${esc(d.detail||'')}</div></div>`;return;}const tg=d.telegram||{};const tgLabel=tg.sent?(tg.duplicateSuppressed?'Telegram: Daha önce gönderildi, tekrar engellendi':'Telegram: Otomatik gönderildi'):(tg.error||tg.reason?`Telegram gönderilemedi: ${tg.error||tg.reason}`:'Telegram gönderim durumu doğrulanamadı');box.innerHTML=`<div class="head"><span>${d.type==='surprise' ? '🎲 MAÇ ÖNÜ SÜRPRİZ 10 MAÇ' : d.type==='live' ? '⚡ CANLI EN GÜVENİLİR TEK TERCİH' : '🎯 MAÇ ÖNÜ KUPONU'} · ${esc(d.date)}</span><span><b>${tg.sent?'TELEGRAM GÖNDERİLDİ':'GÖNDERİM KONTROLÜ'}</b></span></div><div style="margin:10px 0">${d.picks.map((p,i)=>`<div class="statteam"><div class="head"><span>${esc(p.league)}</span><span>${p.minute!=null?esc(p.minute)+"' · Skor: "+esc(p.currentScore||'0-0'):'Maç önü'}</span></div><div style="font-weight:850;margin:8px 0">${esc(p.home)} VS ${esc(p.away)}</div><div class="statline"><span>Tercih</span><b>${esc(p.market)}</b></div><div class="small">Oran kaynağı: ${esc(p.source||'Belirtilmedi')} · ${esc(p.oddsBasis||'Oran kaynağı doğrulanmalı')}</div>${p.statsSummary&&p.statsSummary.length?`<div class="small">Canlı istatistik: ${esc(p.statsSummary.join(' · '))}</div>`:''}</div>`).join('')}</div><div class="small" style="margin-top:8px">${esc(tgLabel)}. Kupon üretildiğinde Telegram gönderimi otomatik denenir; manuel onay gerekmez.</div>`}
async function makeCoupon(){const b=$('makeCoupon');b.disabled=true;try{if(!$('date').value)throw Error('Önce maç tarihini seç.');let r=await fetch('/api/coupon/best?date='+encodeURIComponent($('date').value));let d=await r.json();if(!r.ok&&!d.error)d.error='Tek maç seçilemedi.';renderCoupon(d);if(d.message&&d.status==='READY')$('couponResult').insertAdjacentHTML('beforeend',`<div class="small" style="margin-top:8px">${esc(d.message)}</div>`);}catch(e){$('couponResult').innerHTML=`<span class="err">${esc(e.message)}</span>`}finally{b.disabled=false;}}
async function makeLiveBest(){const b=$('makeLiveBest');b.disabled=true;try{let date=$('date').value||new Date().toISOString().slice(0,10);let r=await fetch('/api/coupon/live-best?date='+encodeURIComponent(date));let d=await r.json();if(!r.ok&&!d.error)d.error='Canlı tercih bulunamadı.';renderCoupon(d);if(d.message&&d.status==='READY')$('couponResult').insertAdjacentHTML('beforeend',`<div class="small" style="margin-top:8px">${esc(d.message)}</div>`);}catch(e){$('couponResult').innerHTML=`<span class="err">${esc(e.message)}</span>`}finally{b.disabled=false;}}
async function approveAnalysis(id,mode){const match=[...matches,...bulletinMatches].find(x=>Number(x.id)===Number(id));const box=$('a'+id);if(!match||!box)return;const vals={};box.querySelectorAll('.table tr').forEach(row=>{const c=row.querySelectorAll('td');if(c.length===2)vals[c[0].textContent.trim()]=c[1].textContent.trim()});const analysis={mainPick:vals['ANA TERCİH']||'—',alternative:vals['ALTERNATİF']||'—',halfTimeScore:vals['İY SKOR']||'—',fullTimeScore:vals['MS SKOR']||'—',livePick:vals['CANLI TERCİH']||'—'};try{await fetch('/api/analyses/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fixtureId:Number(id),matchDate:match.fixtureDate||'',home:match.home,away:match.away,analysis})});alert('Analiz onaylandı.');}catch(e){alert('Hata: '+e.message);}}
function closeArchives(){$('analysesArchive').classList.add('hidden');$('couponsArchive').classList.add('hidden');}
async function loadArchives(which){const box=$(which==='analysis'?'analysesArchiveList':'couponsArchiveList');box.textContent='Yükleniyor…';try{let r=await fetch('/api/archives'),j=await r.json();if(which==='analysis'){box.innerHTML=(j.analyses||[]).length?j.analyses.map(x=>`<div class="archive-item"><div class="title">${esc(x.home_team)} VS ${esc(x.away_team)}</div><div class="rowline"><span>Ana tercih</span><b>${esc(x.analysis?.mainPick||'—')}</b></div><div class="rowline"><span>İY / MS skor</span><b>${esc(x.analysis?.halfTimeScore||'—')} / ${esc(x.analysis?.fullTimeScore||'—')}</b></div></div>`).join(''):'<div class="empty">Kayıt yok.</div>';}else{box.innerHTML=(j.coupons||[]).length?j.coupons.map(x=>`<div class="archive-item"><div class="title">${x.isLive?'🎯 Canlı Kombin':'Kupon'} · ${esc(x.date||'')}</div></div>`).join(''):'<div class="empty">Kayıt yok.</div>';}}catch(e){box.innerHTML=`<div class="err">${esc(e.message)}` }}
window.analyze=analyze;window.stats=stats;$('refresh').onclick=live;$('bulletin').onclick=bulletin;$('searchMatch').onclick=searchMatch;$('matchSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchMatch()});$('clearMatchSearch').onclick=clearMatchSearch;$('makeCoupon').onclick=makeCoupon;$('makeLiveBest').onclick=makeLiveBest;$('showAnalyses').onclick=()=>{closeArchives();$('analysesArchive').classList.remove('hidden');loadArchives('analysis');};$('showCoupons').onclick=()=>{closeArchives();$('couponsArchive').classList.remove('hidden');loadArchives('coupon');};$('filter').onchange=render;let d=new Date();$('date').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;live();
</script></body></html>
