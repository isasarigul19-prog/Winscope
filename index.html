<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinScope Live</title>
<style>
:root{--bg:#04191e;--p:#08272d;--p2:#0c343b;--line:#15505a;--t:#f1fbfc;--m:#9bb9bf;--pink:#ff2f63;--green:#42e6a0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#031419,#073038 65%,#04191e);color:var(--t);font:14px system-ui,sans-serif}
header{padding:16px;max-width:1050px;margin:auto;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-weight:950;letter-spacing:.08em;font-size:25px}.logo span{font-size:13px;color:var(--pink);margin-left:4px;font-weight:700}
.small,.sub{color:var(--m);font-size:12px;line-height:1.45}main{max-width:1050px;margin:auto;padding:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
button{cursor:pointer}.primary,.active{background:var(--pink);border-color:var(--pink);font-weight:800}
button:disabled{opacity:.55;cursor:wait}.panel,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--p),#062126);padding:13px;margin:12px 0}
.head{display:flex;justify-content:space-between;color:var(--m);font-size:12px;gap:8px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:17px 0}
.team{font-weight:850;font-size:17px;overflow-wrap:anywhere}.team:last-child{text-align:right}
.score{font-weight:950;font-size:26px;white-space:nowrap}.meta{text-align:center;color:var(--m);font-size:11px}
.table{width:100%;border-spacing:0 5px}.table td{background:#06242a;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.table td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px;color:var(--m);width:48%}
.table td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0;font-weight:800}
.hidden{display:none!important}.empty{padding:18px;text-align:center;color:var(--m)}.err{color:#ff9baa}
#matchSearch{flex:1;min-width:180px}.pick{color:var(--green)}.status{font-weight:800}
@media(max-width:560px){header{padding:12px}.logo{font-size:21px}.team{font-size:14px}.score{font-size:22px}.table td{padding:8px;font-size:12px}}
</style>
</head>
<body>
<header>
  <div><div class="logo">WINSCOPE <span>LIVE</span></div><div class="sub">Canlı futbol analiz ve alarm sistemi</div></div>
  <div class="small" id="conn">BAĞLANIYOR</div>
</header>
<main>
  <div class="toolbar">
    <button class="primary" id="refresh">↻ Canlı maçlar</button>
    <input id="date" type="date">
    <button id="bulletin">Bülten</button>
    <select id="filter"><option value="all">Tüm maçlar</option><option value="live">Canlı</option></select>
  </div>
  <section class="panel" id="matchSearchPanel">
    <h3 style="margin:2px 0 8px">🔎 1’e 1 MAÇ ARA</h3>
    <div class="toolbar" style="margin:0">
      <input id="matchSearch" type="search" placeholder="Takım adı: Fenerbahçe, Barcelona…">
      <button id="searchMatch" class="primary">Maç Ara</button><button id="clearMatchSearch">Temizle</button>
    </div>
    <div id="matchSearchResult" class="small" style="margin-top:8px">Aramak için takım adını yaz.</div>
  </section>
  <section class="panel" id="couponPanel">
    <h3 style="margin:2px 0 10px">🎯 WINSCOPE KUPONLARI</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="makeCoupon" class="primary">⚽ Maç Önü Kuponu</button>
      <button id="makeSurpriseCoupon">🎲 10 Maça Kadar Sürpriz</button>
      <button id="makeLiveBest" style="background:#42e6a0;color:#04191e;font-weight:900;border:none">⚡ Canlı Tek Tercih</button>
    </div>
    <div id="couponResult" class="small" style="margin-top:12px"></div>
  </section>
  <div id="msg" class="small"></div>
  <section id="matches"><div class="empty">Maçlar yükleniyor…</div></section>
</main>
<script>
const $=x=>document.getElementById(x);
let matches=[],bulletinMatches=[],viewMode='live';
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(m){
  return `<article class="card" id="m${Number(m.id)}">
    <div class="head"><span>${esc(m.country)} · ${esc(m.league)}</span><span>${esc(m.status)} ${m.minute!=null?esc(m.minute)+"'":''}</span></div>
    <div class="teams"><div class="team">${esc(m.home)}</div><div class="score">${esc(m.homeScore)} : ${esc(m.awayScore)}</div><div class="team">${esc(m.away)}</div></div>
    <div class="toolbar"><button class="primary" onclick="analyze(${Number(m.id)})">MAÇ ANALİZİ</button></div>
    <div id="a${Number(m.id)}"><div class="empty">Analiz için dokun.</div></div>
  </article>`;
}
async function getJson(url){
  const r=await fetch(url); let j={};
  try{j=await r.json()}catch{}
  if(!r.ok)throw new Error(j.detail||j.error||`Sunucu hatası (${r.status})`);
  return j;
}
async function live(){
  viewMode='live';$('matches').innerHTML='<div class="empty">Canlı maçlar yükleniyor…</div>';
  try{
    const j=await getJson('/api/live');matches=j.matches||[];$('conn').textContent='SUNUCU BAĞLI';
    $('matches').innerHTML=matches.length?matches.map(card).join(''):'<div class="empty">Şu anda canlı maç bulunamadı.</div>';
  }catch(e){$('conn').textContent='HATA';$('matches').innerHTML=`<div class="empty err">${esc(e.message)}</div>`;}
}
async function bulletin(){
  const d=$('date').value;if(!d){$('msg').textContent='Önce tarih seç.';return}
  viewMode='bulletin';$('matches').innerHTML='<div class="empty">Bülten yükleniyor…</div>';
  try{
    const j=await getJson('/api/fixtures?date='+encodeURIComponent(d));bulletinMatches=j.matches||[];
    $('matches').innerHTML=bulletinMatches.length?bulletinMatches.map(card).join(''):'<div class="empty">Seçilen tarihte maç bulunamadı.</div>';
    $('msg').textContent=`Bültende ${bulletinMatches.length} maç var.`;
  }catch(e){$('matches').innerHTML=`<div class="empty err">Bülten yüklenemedi: ${esc(e.message)}</div>`;}
}
async function searchMatch(){
  const q=$('matchSearch').value.trim().toLocaleLowerCase('tr-TR'),out=$('matchSearchResult');
  if(!q){out.innerHTML='<span class="err">Önce takım adı yaz.</span>';return}
  const d=$('date').value;if(!d){out.innerHTML='<span class="err">Önce tarih seç.</span>';return}
  out.textContent='Aranıyor…';
  try{
    if(!bulletinMatches.length||viewMode!=='bulletin'){
      const j=await getJson('/api/fixtures?date='+encodeURIComponent(d));bulletinMatches=j.matches||[];
    }
    const found=bulletinMatches.filter(m=>`${m.home||''} ${m.away||''}`.toLocaleLowerCase('tr-TR').includes(q));
    if(!found.length){out.textContent='Eşleşen maç bulunamadı.';return}
    viewMode='search';$('matches').innerHTML=found.map(card).join('');out.textContent=`${found.length} maç bulundu.`;
  }catch(e){out.innerHTML=`<span class="err">${esc(e.message)}</span>`}
}
function yesNo(v){return v?'Mevcut':'Oran verisi yok'}
async function analyze(id){
  const box=$('a'+id);box.innerHTML='<div class="empty">Maç verileri ve oran sinyalleri analiz ediliyor…</div>';
  try{
    const j=await getJson(`/api/match/${id}/analyze`);
    if(j.error)throw new Error(j.detail||j.error);
    const m=j.markets||{};
    const rows=[
      ['İY 1X2 oran verisi',yesNo(m.iy1x2)],['MS 1X2 oran verisi',yesNo(m.ms1x2)],
      ['İY 0.5 ÜST oran verisi',yesNo(m.iy05)],['İY 1.5 ÜST oran verisi',yesNo(m.iy15)],
      ['KG VAR/YOK oran verisi',yesNo(m.btts)],['MS 1.5 ÜST oran verisi',yesNo(m.ms15)],
      ['MS 2.5 ÜST oran verisi',yesNo(m.ms25)],['MS 3.5 ÜST oran verisi',yesNo(m.ms35)],
      ['MS 5.5 ÜST oran verisi',yesNo(m.ms55)],['AH -0.5 oran verisi',yesNo(m.ah05)],
      ['İY SKOR TAHMİNİ',j.halfTimeScore],['MS SKOR TAHMİNİ',j.fullTimeScore],
      ['ANA TERCİH',j.mainPick],['ALTERNATİF',j.alternative],['CANLI TERCİH',j.livePick]
    ];
    box.innerHTML=`<table class="table">${rows.map(([a,b])=>`<tr><td>${esc(a)}</td><td class="${/TERCİH/.test(a)?'pick':''}">${esc(b??'—')}</td></tr>`).join('')}</table>
      <div class="small" style="margin-top:8px">${esc(j.note||'')}</div>
      <div class="small" style="margin-top:5px">Takım formu: ${j.form?.homeAvailable?'ev sahibi mevcut':'ev sahibi bulunamadı'} · ${j.form?.awayAvailable?'deplasman mevcut':'deplasman bulunamadı'}${j.liveStatsAvailable?' · canlı istatistik mevcut':''}</div>`;
  }catch(e){box.innerHTML=`<div class="small err">${esc(e.message)}</div>`}
}
function renderCoupon(d){
  const box=$('couponResult');
  if(d.status==='ERROR'||d.error){box.innerHTML=`<div class="err"><b>Kupon oluşturulamadı:</b> ${esc(d.error||d.message||'Bilinmeyen hata')}</div>`;return}
  if(!d.picks||!d.picks.length){box.innerHTML=`<div class="err"><b>${esc(d.message||'Uygun maç bulunamadı.')}</b></div>`;return}
  const tg=d.telegramSent===true?'Telegram gönderildi':d.telegramSent===false?'Telegram gönderilemedi veya yapılandırılmadı':'Hazır';
  box.innerHTML=`<div class="head"><span>Kupon: <b>${esc(String(d.type||'').toUpperCase())}</b></span><span class="status">${esc(tg)}</span></div>
  <div style="margin:10px 0">${d.picks.map(p=>`<div style="padding:8px 2px;border-bottom:1px solid var(--line)"><b>${esc(p.home)} vs ${esc(p.away)}</b><div class="pick" style="margin-top:4px">Tercih: ${esc(p.market)}</div></div>`).join('')}</div>`;
}
async function runCoupon(url,button){
  const box=$('couponResult');button.disabled=true;box.textContent='Kupon hazırlanıyor…';
  try{renderCoupon(await getJson(url))}catch(e){box.innerHTML=`<div class="err">Kupon oluşturulamadı: ${esc(e.message)}</div>`}
  finally{button.disabled=false}
}
$('refresh').onclick=live;$('bulletin').onclick=bulletin;$('searchMatch').onclick=searchMatch;
$('matchSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchMatch()});
$('clearMatchSearch').onclick=()=>{$('matchSearch').value='';$('matchSearchResult').textContent='Aramak için takım adını yaz.'};
$('makeCoupon').onclick=()=>runCoupon('/api/coupon/best?date='+encodeURIComponent($('date').value),$('makeCoupon'));
$('makeSurpriseCoupon').onclick=()=>runCoupon('/api/coupon/surprise?date='+encodeURIComponent($('date').value),$('makeSurpriseCoupon'));
$('makeLiveBest').onclick=()=>runCoupon('/api/coupon/live-best',$('makeLiveBest'));
$('filter').onchange=()=>{if($('filter').value==='live')live();else if(viewMode==='live')live();else bulletin()};
const now=new Date();$('date').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
live();
</script>
</body>
</html>
