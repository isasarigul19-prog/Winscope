<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinScope Live</title><style>
:root{--bg:#04191e;--p:#08272d;--p2:#0c343b;--line:#15505a;--t:#f1fbfc;--m:#9bb9bf;--pink:#ff2f63;--green:#42e6a0;--amber:#ffd04a;--gray:#7f9da3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#031419,#073038 65%,#04191e);color:var(--t);font:14px system-ui,sans-serif}header{padding:16px;max-width:1050px;margin:auto;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-weight:950;letter-spacing:.08em;font-size:25px}.logo span{font-size:13px;color:var(--pink);margin-left:4px;font-weight:700}.small,.sub{color:var(--m);font-size:12px;line-height:1.45}main{max-width:1050px;margin:auto;padding:12px}.toolbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}button{cursor:pointer}.primary,.active{background:var(--pink);border-color:var(--pink);font-weight:800}.panel,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--p),#062126);padding:13px;margin:12px 0}.head{display:flex;justify-content:space-between;color:var(--m);font-size:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:17px 0}.team{font-weight:850;font-size:17px;overflow-wrap:anywhere}.team:last-child{text-align:right}.score{font-weight:950;font-size:26px;white-space:nowrap}.meta{text-align:center;color:var(--m);font-size:11px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#062126;border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0}.tabs button{border:0;background:transparent;padding:8px 4px;font-size:12px}.tabs button.active{background:var(--pink)}.table{width:100%;border-spacing:0 5px}.table td{background:#06242a;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px;color:var(--m)}.table td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0;font-weight:800}.table tr:not(:last-child) td{padding:12px 11px;font-size:14px;line-height:1.35}.table tr:not(:last-child) td:first-child{width:38%;font-size:13px}.table tr:not(:last-child) td:last-child{font-size:15px;font-weight:900}.match-row{background:#06242a;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;font-size:12px}.match-row .m-head{color:var(--m);font-size:10px;display:flex;justify-content:space-between}.match-row .m-teams{font-weight:700;margin-top:4px;display:flex;justify-content:space-between}.hidden{display:none!important}.empty{padding:18px;text-align:center;color:var(--m)}.err{color:#ff9baa}#matchSearch{flex:0 1 220px!important;min-width:120px!important;max-width:260px}#searchMatch,#clearMatchSearch{padding:8px 10px;font-size:12px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.stat-item{background:#06242a;border:1px solid var(--line);border-radius:8px;padding:7px;display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:11px;line-height:1.25;min-width:0}.stat-item .stat-name{color:var(--m);overflow-wrap:anywhere}.stat-item .stat-value{font-weight:850;white-space:nowrap;font-size:11px}.common-grid{grid-template-columns:1fr 1fr;gap:4px}.common-grid .stat-item{padding:6px 8px;font-size:11px;align-items:flex-start}.common-grid .stat-name{max-width:65%}.common-grid .stat-value{font-size:12px}.stats-title{font-weight:800;font-size:12px;margin:3px 0 5px}.stats-note{color:var(--m);font-size:10px;line-height:1.3;padding:5px 2px}.stats-error{color:#ff9baa;padding:12px}@media(max-width:420px){.table tr:not(:last-child) td{padding:11px 9px;font-size:13px}.table tr:not(:last-child) td:first-child{font-size:12px}.table tr:not(:last-child) td:last-child{font-size:14px}.team{font-size:15px}.score{font-size:23px}.table td{padding:7px;font-size:12px}.panel,.card{padding:10px}.stat-item{padding:6px;gap:4px;font-size:10px}.stat-item .stat-value{font-size:10px}.stats-grid{grid-template-columns:1fr 1fr;gap:4px}}
</style></head><body><header><div><div class="logo">WINSCOPE <span>LIVE</span></div><div class="sub">Canlı futbol analiz ve alarm sistemi</div></div><div class="small" id="conn">BAĞLANIYOR</div></header><main><div class="toolbar"><button class="primary" id="refresh">↻ Canlı maçlar</button><input id="date" type="date"><button id="bulletin">Bülten</button><button id="showAnalyses">Günün Analizleri</button><button id="showCoupons">Günün Kuponları</button><select id="filter"><option value="all">Tüm maçlar</option><option value="live">Canlı</option></select></div><section class="panel" id="matchSearchPanel"><h3 style="margin:2px 0 8px">🔎 1’e 1 MAÇ ARA</h3><div class="toolbar" style="margin:0"><input id="matchSearch" type="search" placeholder="Takım adı: Fenerbahçe, Barcelona…" style="flex:1;min-width:180px"><button id="searchMatch" class="primary">Maç Ara</button><button id="clearMatchSearch">Temizle</button></div><div id="matchSearchResult" class="small" style="margin-top:8px">Aramak için takım adını yaz.</div></section><section class="panel" id="couponPanel"><h3 style="margin:2px 0 10px">🎯 GÜNÜN KUPONU & CANLI KOMBİN</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="makeCoupon" class="primary">Maç Önü Taslak</button><button id="makeLiveCoupon" style="background:#42e6a0;color:#04191e;font-weight:900;border:none">⚡ Canlı Kombin Oluştur</button></div><div id="couponResult" class="small" style="margin-top:12px"></div></section><div id="msg" class="small"></div><section id="matches"><div class="empty">Maçlar yükleniyor…</div></section></main><script>
const $=x=>document.getElementById(x);let matches=[],bulletinMatches=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function kickoffText(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d)}
function card(m){const ko=kickoffText(m.fixtureDate);return `<article class="card" id="m${Number(m.id)}"><div class="head"><span>${esc(m.country||'')} · ${esc(m.league||'')}</span><span>${ko?esc(ko)+' · ':''}${esc(m.status==='NS'?'BAŞLAMADI':(m.status==='FT'?'MAÇ BİTTİ':m.status||''))}${m.minute!=null&&!['NS','FT'].includes(m.status)?' · '+esc(m.minute)+"'":''}</span></div><div class="teams"><div class="team">${esc(m.home)}</div><div class="score">${esc(m.homeScore??'–')} : ${esc(m.awayScore??'–')}</div><div class="team">${esc(m.away)}</div></div><div class="meta">İddaa Kod: ${esc(m.iddaaCode||m.id)}</div><div class="tabs"><button class="active" onclick="analyze(${Number(m.id)})">MAÇ ANALİZİ</button><button onclick="stats(${Number(m.id)})">İSTATİSTİK</button></div><div id="a${Number(m.id)}"><div class="empty">Analiz için tıkla.</div></div><div id="s${Number(m.id)}" class="hidden"></div></article>`}
function render(){let a=$('filter').value==='live'?matches.filter(m=>!['FT','AET','PEN','NS'].includes(m.status)):matches;$('matches').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Maç bulunamadı.</div>'}
async function live(){try{let r=await fetch('/api/live'),j=await r.json();$('conn').textContent=r.ok?'SUNUCU BAĞLI':'API HATASI';if(!r.ok){matches=[];$('matches').innerHTML=`<div class="empty err">${esc(j.detail||j.error||'Canlı maç verisi alınamadı.')}</div>`;return}matches=j.matches||[];render()}catch(e){$('conn').textContent='HATA';$('matches').innerHTML=`<div class="empty err">Bağlantı hatası: ${esc(e.message)}</div>`}}
async function bulletin(){let d=$('date').value;if(!d)return;const box=$('matches');box.innerHTML='<div class="empty">Bülten yükleniyor…</div>';try{let r=await fetch('/api/fixtures?date='+encodeURIComponent(d)),j=await r.json();if(!r.ok){bulletinMatches=[];box.innerHTML=`<div class="empty err">Bülten alınamadı: ${esc(j.detail||j.error||`HTTP ${r.status}`)}</div>`;return}bulletinMatches=j.matches||[];box.innerHTML=bulletinMatches.length?bulletinMatches.map(card).join(''):'<div class="empty">Bu tarih için API-Football maç döndürmedi. Tarihi ve API planını kontrol et.</div>'}catch(e){box.innerHTML=`<div class="empty err">Bülten bağlantı hatası: ${esc(e.message)}</div>`}}
async function searchMatch(){const q=$('matchSearch').value.trim().toLocaleLowerCase('tr-TR');const out=$('matchSearchResult');if(!q){out.innerHTML='<span class="err">Takım adı yaz.</span>';return}const d=$('date').value;out.textContent='Aranıyor…';try{let source=bulletinMatches;if(!source.length){let r=await fetch('/api/fixtures?date='+encodeURIComponent(d));let j=await r.json();source=j.matches||[];bulletinMatches=source}let found=source.filter(m=>`${m.home||''} ${m.away||''}`.toLocaleLowerCase('tr-TR').includes(q));if(!found.length){out.textContent='Maç bulunamadı.';return}matches=source;$('filter').value='all';$('matches').innerHTML=found.map(card).join('');out.textContent=`${found.length} maç bulundu.`}catch(e){out.innerHTML=`<span class="err">Hata: ${esc(e.message)}</span>`}}
function clearMatchSearch(){$('matchSearch').value='';$('matchSearchResult').textContent='Aramak için takım adını yaz.';}
async function analyze(id){let box=$('a'+id);box.innerHTML='<div class="empty">Analiz ediliyor…</div>';try{let r=await fetch(`/api/match/${id}/analyze`),j=await r.json();if(!r.ok)throw new Error(j.detail||j.error||`HTTP ${r.status}`);box.innerHTML=`<table class="table"><tr><td>ANA TERCİH</td><td><b>${esc(j.mainPick)}</b></td></tr><tr><td>ALTERNATİF</td><td>${esc(j.alternative)}</td></tr><tr><td>İY SKOR TAHMİNİ</td><td>${esc(j.halfTimeScore)}</td></tr><tr><td>MS ANA SKOR</td><td>${esc(j.fullTimeScore)}</td></tr><tr><td>MS ALTERNATİF SKOR</td><td>${esc(j.alternativeFullTimeScore||'—')}</td></tr><tr><td>PİYASA HAREKETİ</td><td>${esc(j.marketDirection||'Maç önü oran hareketi ölçülmedi')}</td></tr><tr><td>SÜRPRİZ SENARYOLARI</td><td>${(Array.isArray(j.surpriseScenarios)&&j.surpriseScenarios.length)?j.surpriseScenarios.map(x=>`${esc(x.label)}: %${esc(x.percent)}`).join(' · '):esc(j.surprise||'Yeterli veri yok')}</td></tr><tr><td>SKOR MODELİ</td><td>
  <div>${esc(j.scorePredictionBasis||'Skor modeli açıklaması mevcut değil')}</div>
  ${j.history?.available && j.history?.home && j.history?.away ? `
    <div class="stats-title" style="margin-top:8px">📊 ORTAK YÜZDE · SON 5 MAÇ</div>
    <div class="stats-grid common-grid">
      ${(() => {
        const h=j.history.home, a=j.history.away;
        const avg=(hp,hn,ap,an)=>{
          const n1=Number(hn)||0, n2=Number(an)||0;
          if(hp==null || ap==null || n1<=0 || n2<=0) return 'Veri yok';
          const c1=Math.round(Number(hp)*n1/100), c2=Math.round(Number(ap)*n2/100);
          const total=c1+c2, sample=n1+n2;
          return `%${Math.round(total/sample*100)} (${total}/${sample})`;
        };
        const team15=(team)=>team?.teamGoalsOver15Pct==null || !(Number(team?.sampleSize)>0)
          ? 'Veri yok' : `%${Number(team.teamGoalsOver15Pct)} (${Number(team.teamGoalsOver15Count ?? Math.round(Number(team.teamGoalsOver15Pct)*Number(team.sampleSize)/100))}/${Number(team.sampleSize)})`;
        return [
          ['İY 0.5 ÜST · ortak', avg(h.htOver05Pct,h.halftimeSampleSize,a.htOver05Pct,a.halftimeSampleSize)],
          ['MS KG VAR · ortak', avg(h.bttsPct,h.sampleSize,a.bttsPct,a.sampleSize)],
          ['MS 2.5 ÜST · ortak', avg(h.over25Pct,h.sampleSize,a.over25Pct,a.sampleSize)],
          ['Ev 1.5 ÜST', team15(h)],
          ['Dep 1.5 ÜST', team15(a)]
        ].map(([label,value])=>`<div class="stat-item"><span class="stat-name">${label}</span><span class="stat-value">${value}</span></div>`).join('');
      })()}
    </div>
    <div class="stats-note">Ortak yüzdeler iki takımın son 5 maçından; Ev/Dep 1.5, ilgili takımın attığı gollerden hesaplanır. Garanti değildir.</div>
  ` : `<div class="stats-note">Ortak yüzdeler için veri yetersiz.</div>`}
</td></tr></table>`}catch(e){box.innerHTML=`<div class="empty err">Analiz hatası: ${esc(e.message)}</div>`}}
function normalizeStatsPayload(j){
  // Supports common API response shapes without assuming a single backend schema.
  if(Array.isArray(j?.stats)) return j.stats;
  if(Array.isArray(j?.statistics)) return j.statistics;
  if(Array.isArray(j?.response)) return j.response;
  if(Array.isArray(j?.data)) return j.data;
  if(j?.stats && Array.isArray(j.stats.response)) return j.stats.response;
  return [];
}
function statRows(payload){
  const rows=[];
  const add=(team,type,value)=>{if(value===null||value===undefined||value==='')return;rows.push({team:String(team||'Takım'),type:String(type||'İstatistik'),value:String(value)});};
  for(const item of payload){
    if(!item)continue;
    // API-Football fixtures/statistics standard: {team:{name}, statistics:[{type,value}]}
    if(Array.isArray(item.statistics)){
      const team=item.team?.name||item.teamName||item.name||'Takım';
      for(const s of item.statistics)add(team,s?.type,s?.value);
      continue;
    }
    // Already flattened rows: {team,type,value} or {name,value}
    if(item.type!==undefined || item.value!==undefined){
      add(item.team?.name||item.teamName||item.team||item.name,item.type||item.label,item.value);
      continue;
    }
    // Alternate shape: {team:{name}, stats:[...]}
    if(Array.isArray(item.stats)){
      const team=item.team?.name||item.teamName||item.name||'Takım';
      for(const s of item.stats)add(team,s?.type||s?.name,s?.value);
    }
  }
  return rows;
}
async function stats(id){
  const box=$('s'+id);box.classList.remove('hidden');box.innerHTML='<div class="empty">Canlı istatistikler yükleniyor…</div>';
  try{
    const r=await fetch(`/api/match/${id}/stats`,{headers:{Accept:'application/json'}});
    const j=await r.json();
    if(!r.ok)throw new Error(j.detail||j.error||`HTTP ${r.status}`);
    const payload=normalizeStatsPayload(j);
    const rows=statRows(payload);
    if(rows.length){
      const groups={};
      for(const row of rows){(groups[row.team]??=[]).push(row);}
      box.innerHTML=`<div class="panel"><div class="stats-title">📊 CANLI MAÇ İSTATİSTİKLERİ</div>${Object.entries(groups).map(([team,items])=>`<div class="stats-title">${esc(team)}</div><div class="stats-grid">${items.map(s=>`<div class="stat-item"><span class="stat-name">${esc(s.type)}</span><span class="stat-value">${esc(s.value)}</span></div>`).join('')}</div>`).join('')}</div>`;
    }else{
      const detail=j?.detail||j?.message||j?.note||'API bu maç için kullanılabilir istatistik döndürmedi.';
      box.innerHTML=`<div class="empty">${esc(detail)}</div>`;
      if(j && (j.error||j.detail))box.innerHTML=`<div class="stats-error">İstatistik alınamadı: ${esc(j.detail||j.error)}</div>`;
    }
  }catch(e){box.innerHTML=`<div class="stats-error">İstatistik isteği başarısız: ${esc(e.message)}</div>`;}
}
function renderCoupon(d){const box=$('couponResult');if(!d||d.status==='NO_MATCHES'||!d.picks||!d.picks.length){box.innerHTML=`<div class="err"><b>${esc(d?.note || 'Şu an kriterlere uyan maç bulunmuyor.')}</b></div>`;return;}box.innerHTML=`<div class="head"><span>${d.isLive?'🎯 CANLI KOMBİN':'MAÇ ÖNÜ KUPON'} · ${esc(d.date)}</span></div><div style="margin:10px 0">${d.picks.map(p=>`<div class="match-row"><div class="m-head"><span>Kod: ${esc(p.iddaaCode||'-')} · ${esc(p.league)}</span><span>${p.minute?esc(p.minute)+"' · Skor: "+esc(p.currentScore||'0-0'):''}</span></div><div class="m-teams"><span>${esc(p.home)} vs ${esc(p.away)}</span><b>${esc(p.market)}</b></div></div>`).join('')}</div>`}
async function readApiJson(response){const text=await response.text();try{return JSON.parse(text)}catch{throw new Error(`API JSON yerine başka bir yanıt döndürdü (HTTP ${response.status}). İlgili /api/coupon rotasının Render'daki sunucuda bulunduğunu kontrol et.`)}}
async function makeCoupon(){const b=$('makeCoupon');b.disabled=true;b.textContent='Oluşturuluyor…';try{let r=await fetch('/api/coupon/daily?date='+encodeURIComponent($('date').value),{headers:{Accept:'application/json'}});let d=await readApiJson(r);if(!r.ok)throw new Error(d.note||d.error||`HTTP ${r.status}`);renderCoupon(d)}catch(e){$('couponResult').innerHTML=`<span class="err">Hata: ${esc(e.message)}</span>`}finally{b.disabled=false;b.textContent='Maç Önü Taslak'}}
async function makeLiveCoupon(){const b=$('makeLiveCoupon');b.disabled=true;b.textContent='Canlı Taranıyor…';try{let r=await fetch('/api/coupon/live',{headers:{Accept:'application/json'}});let d=await readApiJson(r);if(!r.ok)throw new Error(d.note||d.error||`HTTP ${r.status}`);renderCoupon(d)}catch(e){$('couponResult').innerHTML=`<span class="err">Hata: ${esc(e.message)}</span>`}finally{b.disabled=false;b.textContent='⚡ Canlı Kombin Oluştur'}}
async function showDailyAnalyses(){const box=$('matches');box.innerHTML='<div class="empty">Günün analizleri yükleniyor…</div>';try{const r=await fetch('/api/analysis/daily',{headers:{Accept:'application/json'}});const d=await readApiJson(r);if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);const rows=Array.isArray(d.analyses)?d.analyses:[];if(!rows.length){box.innerHTML='<div class="empty">Henüz kaydedilmiş analiz yok. Otomatik tarama maçları 6 saatlik pencereye girdikçe analiz oluşturur.</div>';return;}box.innerHTML='<div class="head"><span>🗓️ GÜNÜN ANALİZLERİ · '+rows.length+' kayıt</span></div>'+rows.map(a=>{const x=a.analysis||{};return `<div class="panel"><div class="m-head"><span>${esc(a.league||'Lig bilgisi yok')}</span><span>${esc(a.match_date||a.created_at||'')}</span></div><div class="m-teams"><span>${esc(a.home_team||'Ev sahibi')} vs ${esc(a.away_team||'Deplasman')}</span></div><div class="match-row"><b>Ana tercih:</b> ${esc(x.mainPick||'—')}</div><div class="match-row"><b>Alternatif:</b> ${esc(x.alternative||'—')}</div><div class="match-row"><b>İY skor:</b> ${esc(x.halfTimeScore||'—')}</div><div class="match-row"><b>MS ana skor:</b> ${esc(x.fullTimeScore||'—')}</div><div class="match-row"><b>MS alternatif:</b> ${esc(x.alternativeFullTimeScore||'—')}</div><div class="match-row"><b>Piyasa:</b> ${esc(x.marketDirection||'—')}</div><div class="match-row"><b>Sürpriz:</b> ${esc(x.surprise||'—')}</div></div>`}).join('');}catch(e){box.innerHTML=`<div class="stats-error">Günün analizleri alınamadı: ${esc(e.message)}</div>`}}
$('refresh').onclick=live;$('bulletin').onclick=bulletin;$('searchMatch').onclick=searchMatch;$('clearMatchSearch').onclick=clearMatchSearch;$('makeCoupon').onclick=makeCoupon;$('makeLiveCoupon').onclick=makeLiveCoupon;$('showAnalyses').onclick=showDailyAnalyses;$('showCoupons').onclick=async()=>{try{const r=await fetch('/api/coupon/archive',{headers:{Accept:'application/json'}});const d=await readApiJson(r);const rows=d.coupons||[];$('matches').innerHTML=rows.length?'<div class="head"><span>🎯 KAYITLI KUPONLAR</span></div>'+rows.map(c=>`<div class="panel"><b>${esc(c.date||c.draftId||'Kupon')}</b><div>${(c.picks||[]).map(p=>`<div class="match-row">${esc(p.home||'')} vs ${esc(p.away||'')} · ${esc(p.market||'')}</div>`).join('')}</div></div>`).join(''):'<div class="empty">Kayıtlı kupon bulunamadı.</div>';}catch(e){$('matches').innerHTML=`<div class="stats-error">Kupon arşivi alınamadı: ${esc(e.message)}</div>`}};$('filter').onchange=render;let d=new Date();$('date').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;live();
</script></body></html>
