<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinScope Live</title>
<style>
:root{--bg:#04191e;--p:#08272d;--p2:#0c343b;--line:#15505a;--t:#f1fbfc;--m:#9bb9bf;--pink:#ff2f63;--green:#42e6a0;--amber:#ffd04a;--gray:#7f9da3}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#031419,#073038 65%,#04191e);color:var(--t);font:14px system-ui,sans-serif}
header{padding:16px;max-width:1050px;margin:auto;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-weight:950;letter-spacing:.08em;font-size:25px}.logo span{font-size:13px;color:var(--pink);margin-left:4px;font-weight:700}
.small,.sub{color:var(--m);font-size:12px;line-height:1.45}main{max-width:1050px;margin:auto;padding:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
button{cursor:pointer}.primary,.active{background:var(--pink);border-color:var(--pink);font-weight:800}
.panel,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--p),#062126);padding:13px;margin:12px 0}
.head{display:flex;justify-content:space-between;color:var(--m);font-size:12px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:17px 0}
.team{font-weight:850;font-size:17px;overflow-wrap:anywhere}.team:last-child{text-align:right}
.score{font-weight:950;font-size:26px;white-space:nowrap}.meta{text-align:center;color:var(--m);font-size:11px}
.table{width:100%;border-spacing:0 5px}.table td{background:#06242a;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.table td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px;color:var(--m)}
.table td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0;font-weight:800}
.hidden{display:none!important}.empty{padding:18px;text-align:center;color:var(--m)}.err{color:#ff9baa}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">WINSCOPE <span>LIVE</span></div>
    <div class="sub">Canlı futbol analiz ve alarm sistemi</div>
  </div>
  <div class="small" id="conn">BAĞLANIYOR</div>
</header>
<main>
  <div class="toolbar">
    <button class="primary" id="refresh">↻ Canlı maçlar</button>
    <input id="date" type="date">
    <button id="bulletin">Bülten</button>
  </div>
  <section id="matches"><div class="empty">Maçlar yükleniyor…</div></section>
</main>
<script>
const $=x=>document.getElementById(x);
let matches=[];

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function card(m){
  return `<article class="card" id="m${m.id}">
    <div class="head"><span>${esc(m.country)} · ${esc(m.league)}</span><span>${esc(m.status)} ${m.minute!=null?m.minute+"'":''}</span></div>
    <div class="teams"><div class="team">${esc(m.home)}</div><div class="score">${esc(m.homeScore)} : ${esc(m.awayScore)}</div><div class="team">${esc(m.away)}</div></div>
    <div class="toolbar"><button class="primary" onclick="analyze(${m.id})">MAÇ ANALİZİ</button></div>
    <div id="a${m.id}"><div class="empty">Analiz için dokun.</div></div>
  </article>`;
}

async function live(){
  try{
    let r=await fetch('/api/live'),j=await r.json();
    matches=j.matches||[];
    $('conn').textContent='SUNUCU BAĞLI';
    $('matches').innerHTML=matches.length?matches.map(card).join(''):'<div class="empty">Canlı maç yok.</div>';
  }catch(e){$('conn').textContent='HATA';}
}

async function bulletin(){
  let d=$('date').value;
  if(!d)return;
  try{
    let r=await fetch('/api/fixtures?date='+encodeURIComponent(d)),j=await r.json();
    matches=j.matches||[];
    $('matches').innerHTML=matches.length?matches.map(card).join(''):'<div class="empty">Maç bulunamadı.</div>';
  }catch(e){$('matches').innerHTML='<div class="empty err">Bülten yüklenemedi.</div>';}
}

async function analyze(id){
  let box=$('a'+id);
  box.innerHTML='<div class="empty">Analiz çıkartılıyor…</div>';
  try{
    let r=await fetch(`/api/match/${id}/analyze`),j=await r.json();
    box.innerHTML=`<table class="table">
      <tr><td>İY 1 X 2</td><td>${esc(j.iy1x2)}</td></tr>
      <tr><td>MS 1 X 2</td><td>${esc(j.ms1x2)}</td></tr>
      <tr><td>İY 0.5 ÜST</td><td>${esc(j.iy05)}</td></tr>
      <tr><td>İY 1.5 ÜST</td><td>${esc(j.iy15)}</td></tr>
      <tr><td>KG VAR</td><td>${esc(j.btts)}</td></tr>
      <tr><td>MS 1.5 ÜST</td><td>${esc(j.ms15)}</td></tr>
      <tr><td>MS 2.5 ÜST</td><td>${esc(j.ms25)}</td></tr>
      <tr><td>MS 3.5 ÜST</td><td>${esc(j.ms35)}</td></tr>
      <tr><td>AH -0.5</td><td>${esc(j.ah05)}</td></tr>
      <tr><td>İY SKOR TAHMİNİ</td><td>${esc(j.halfTimeScore)}</td></tr>
      <tr><td>MS SKOR TAHMİNİ</td><td>${esc(j.fullTimeScore)}</td></tr>
      <tr><td>ANA TERCİH</td><td>${esc(j.mainPick)}</td></tr>
      <tr><td>ALTERNATİF</td><td>${esc(j.alternative)}</td></tr>
      <tr><td>CANLI TERCİH</td><td>${esc(j.livePick)}</td></tr>
    </table>
    <div class="small" style="margin-top:8px">${esc(j.note)}</div>`;
  }catch(e){box.innerHTML=`<div class="small err">${esc(e.message)}</div>`;}
}

$('refresh').onclick=live;
$('bulletin').onclick=bulletin;
let d=new Date();
$('date').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
live();
</script>
</body>
</html>
