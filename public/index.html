<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinScope Live</title><style>
:root{--bg:#04191e;--p:#08272d;--p2:#0c343b;--line:#15505a;--t:#f1fbfc;--m:#9bb9bf;--pink:#ff2f63;--green:#42e6a0;--amber:#ffd04a;--gray:#7f9da3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#031419,#073038 65%,#04191e);color:var(--t);font:14px system-ui,sans-serif}header{padding:16px;max-width:1050px;margin:auto;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-weight:950;letter-spacing:.08em;font-size:25px}.logo span{font-size:13px;color:var(--pink);margin-left:4px;font-weight:700}.small,.sub{color:var(--m);font-size:12px;line-height:1.45}main{max-width:1050px;margin:auto;padding:12px}.toolbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}button{cursor:pointer}.primary,.active{background:var(--pink);border-color:var(--pink);font-weight:800}.panel,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--p),#062126);padding:13px;margin:12px 0}.head{display:flex;justify-content:space-between;color:var(--m);font-size:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:17px 0}.team{font-weight:850;font-size:17px;overflow-wrap:anywhere}.team:last-child{text-align:right}.score{font-weight:950;font-size:26px;white-space:nowrap}.meta{text-align:center;color:var(--m);font-size:11px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#062126;border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0}.tabs button{border:0;background:transparent;padding:8px 4px;font-size:12px}.tabs button.active{background:var(--pink)}.table{width:100%;border-spacing:0 5px}.table td{background:#06242a;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px;color:var(--m)}.table td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0;font-weight:800}.match-row{background:#06242a;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;font-size:12px}.match-row .m-head{color:var(--m);font-size:10px;display:flex;justify-content:space-between}.match-row .m-teams{font-weight:700;margin-top:4px;display:flex;justify-content:space-between}.hidden{display:none!important}.empty{padding:18px;text-align:center;color:var(--m)}.err{color:#ff9baa}#matchSearch{flex:0 1 220px!important;min-width:120px!important;max-width:260px}#searchMatch,#clearMatchSearch{padding:8px 10px;font-size:12px}</style></head><body><header><div><div class="logo">WINSCOPE <span>LIVE</span></div><div class="sub">Canlı futbol analiz ve alarm sistemi</div></div><div class="small" id="conn">BAĞLANIYOR</div></header><main><div class="toolbar"><button class="primary" id="refresh">↻ Canlı maçlar</button><input id="date" type="date"><button id="bulletin">Bülten</button><button id="showAnalyses">Günün Analizleri</button><button id="showCoupons">Günün Kuponları</button><select id="filter"><option value="all">Tüm maçlar</option><option value="live">Canlı</option></select></div><section class="panel" id="matchSearchPanel"><h3 style="margin:2px 0 8px">🔎 1’e 1 MAÇ ARA</h3><div class="toolbar" style="margin:0"><input id="matchSearch" type="search" placeholder="Takım adı: Fenerbahçe, Barcelona…" style="flex:1;min-width:180px"><button id="searchMatch" class="primary">Maç Ara</button><button id="clearMatchSearch">Temizle</button></div><div id="matchSearchResult" class="small" style="margin-top:8px">Aramak için takım adını yaz.</div></section><section class="panel" id="couponPanel"><h3 style="margin:2px 0 10px">🎯 GÜNÜN KUPONU & CANLI KOMBİN</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="makeCoupon" class="primary">Maç Önü Taslak</button><button id="makeLiveCoupon" style="background:#42e6a0;color:#04191e;font-weight:900;border:none">⚡ Canlı Kombin Oluştur</button></div><div id="couponResult" class="small" style="margin-top:12px"></div></section><div id="msg" class="small"></div><section id="matches"><div class="empty">Maçlar yükleniyor…</div></section></main><script>
const $=x=>document.getElementById(x);let matches=[],bulletinMatches=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function kickoffText(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d)}
function card(m){const ko=kickoffText(m.fixtureDate);return `<article class="card" id="m${Number(m.id)}"><div class="head"><span>${esc(m.country||'')} · ${esc(m.league||'')}</span><span>${ko?esc(ko)+' · ':''}${esc(m.status==='NS'?'BAŞLAMADI':(m.status==='FT'?'MAÇ BİTTİ':m.status||''))}${m.minute!=null&&!['NS','FT'].includes(m.status)?' · '+esc(m.minute)+"'":''}</span></div><div class="teams"><div class="team">${esc(m.home)}</div><div class="score">${esc(m.homeScore??'–')} : ${esc(m.awayScore??'–')}</div><div class="team">${esc(m.away)}</div></div><div class="meta">İddaa Kod: ${esc(m.iddaaCode||m.id)}</div><div class="tabs"><button class="active" onclick="analyze(${Number(m.id)})">MAÇ ANALİZİ</button><button onclick="stats(${Number(m.id)})">İSTATİSTİK</button></div><div id="a${Number(m.id)}"><div class="empty">Analiz için tıkla.</div></div><div id="s${Number(m.id)}" class="hidden"></div></article>`}
function render(){let a=$('filter').value==='live'?matches.filter(m=>!['FT','AET','PEN','NS'].includes(m.status)):matches;$('matches').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Maç bulunamadı.</div>'}
async function live(){try{let r=await fetch('/api/live'),j=await r.json();$('conn').textContent=r.ok?'SUNUCU BAĞLI':'API HATASI';if(!r.ok){matches=[];$('matches').innerHTML=`<div class="empty err">${esc(j.detail||j.error||'Canlı maç verisi alınamadı.')}</div>`;return}matches=j.matches||[];render()}catch(e){$('conn').textContent='HATA';$('matches').innerHTML=`<div class="empty err">Bağlantı hatası: ${esc(e.message)}</div>`}}
async function bulletin(){let d=$('date').value;if(!d)return;const box=$('matches');box.innerHTML='<div class="empty">Bülten yükleniyor…</div>';try{let r=await fetch('/api/fixtures?date='+encodeURIComponent(d)),j=await r.json();if(!r.ok){bulletinMatches=[];box.innerHTML=`<div class="empty err">Bülten alınamadı: ${esc(j.detail||j.error||`HTTP ${r.status}`)}</div>`;return}bulletinMatches=j.matches||[];box.innerHTML=bulletinMatches.length?bulletinMatches.map(card).join(''):'<div class="empty">Bu tarih için API-Football maç döndürmedi. Tarihi ve API planını kontrol et.</div>'}catch(e){box.innerHTML=`<div class="empty err">Bülten bağlantı hatası: ${esc(e.message)}</div>`}}
async function searchMatch(){const q=$('matchSearch').value.trim().toLocaleLowerCase('tr-TR');const out=$('matchSearchResult');if(!q){out.innerHTML='<span class="err">Takım adı yaz.</span>';return}const d=$('date').value;out.textContent='Aranıyor…';try{let source=bulletinMatches;if(!source.length){let r=await fetch('/api/fixtures?date='+encodeURIComponent(d));let j=await r.json();source=j.matches||[];bulletinMatches=source}let found=source.filter(m=>`${m.home||''} ${m.away||''}`.toLocaleLowerCase('tr-TR').includes(q));if(!found.length){out.textContent='Maç bulunamadı.';return}matches=source;$('filter').value='all';$('matches').innerHTML=found.map(card).join('');out.textContent=`${found.length} maç bulundu.`}catch(e){out.innerHTML=`<span class="err">Hata: ${esc(e.message)}</span>`}}
function clearMatchSearch(){$('matchSearch').value='';$('matchSearchResult').textContent='Aramak için takım adını yaz.';}
async function analyze(id){let box=$('a'+id);box.innerHTML='<div class="empty">Analiz ediliyor…</div>';try{let r=await fetch(`/api/match/${id}/analyze`),j=await r.json();box.innerHTML=`<table class="table"><tr><td>ANA TERCİH</td><td><b>${esc(j.mainPick)}</b></td></tr><tr><td>ALTERNATİF</td><td>${esc(j.alternative)}</td></tr><tr><td>İY SKOR TAHMİNİ</td><td>${esc(j.halfTimeScore)}</td></tr><tr><td>MS ANA SKOR</td><td>${esc(j.fullTimeScore)}</td></tr><tr><td>MS ALTERNATİF SKOR</td><td>${esc(j.alternativeFullTimeScore||'—')}</td></tr><tr><td>SKOR MODELİ</td><td>${esc(j.scorePredictionBasis||'')}</td></tr></table>`}catch(e){box.innerHTML='<div class="empty">Hata oluştu.</div>'}}
async function stats(id){let box=$('s'+id);box.classList.remove('hidden');box.innerHTML='<div class="empty">Yükleniyor…</div>';try{let r=await fetch(`/api/match/${id}/stats`),j=await r.json();let list=j.stats||[];box.innerHTML=list.length?'<div class="panel">İstatistikler mevcut</div>':'<div class="empty">Veri yok.</div>'}catch(e){box.innerHTML='<div class="empty">Hata.</div>'}}

function renderCoupon(d){
 const box=$('couponResult');
 if(!d||d.status==='NO_MATCHES'||!d.picks||!d.picks.length){box.innerHTML=`<div class="err"><b>${esc(d?.note || 'Şu an kriterlere uyan maç bulunmuyor.')}</b></div>`;return;}
 box.innerHTML=`<div class="head"><span>${d.isLive?'🎯 CANLI KOMBİN':'MAÇ ÖNÜ KUPON'} · ${esc(d.date)}</span></div><div style="margin:10px 0">${d.picks.map(p=>`<div class="match-row"><div class="m-head"><span>Kod: ${esc(p.iddaaCode||'-')} · ${esc(p.league)}</span><span>${p.minute?esc(p.minute)+"' · Skor: "+esc(p.currentScore||'0-0'):''}</span></div><div class="m-teams"><span>${esc(p.home)} vs ${esc(p.away)}</span><b>${esc(p.market)}</b></div></div>`).join('')}</div>`;
}
async function readApiJson(response){const text=await response.text();try{return JSON.parse(text)}catch{throw new Error(`API JSON yerine başka bir yanıt döndürdü (HTTP ${response.status}). İlgili /api/coupon rotasının Render'daki sunucuda bulunduğunu kontrol et.`)}}
async function makeCoupon(){const b=$('makeCoupon');b.disabled=true;b.textContent='Oluşturuluyor…';try{let r=await fetch('/api/coupon/daily?date='+encodeURIComponent($('date').value),{headers:{Accept:'application/json'}});let d=await readApiJson(r);if(!r.ok)throw new Error(d.note||d.error||`HTTP ${r.status}`);renderCoupon(d);}catch(e){$('couponResult').innerHTML=`<span class="err">Hata: ${esc(e.message)}</span>`;}finally{b.disabled=false;b.textContent='Maç Önü Taslak';}}
async function makeLiveCoupon(){const b=$('makeLiveCoupon');b.disabled=true;b.textContent='Canlı Taranıyor…';try{let r=await fetch('/api/coupon/live',{headers:{Accept:'application/json'}});let d=await readApiJson(r);if(!r.ok)throw new Error(d.note||d.error||`HTTP ${r.status}`);renderCoupon(d);}catch(e){$('couponResult').innerHTML=`<span class="err">Hata: ${esc(e.message)}</span>`;}finally{b.disabled=false;b.textContent='⚡ Canlı Kombin Oluştur';}}

$('refresh').onclick=live;$('bulletin').onclick=bulletin;$('searchMatch').onclick=searchMatch;$('clearMatchSearch').onclick=clearMatchSearch;$('makeCoupon').onclick=makeCoupon;$('makeLiveCoupon').onclick=makeLiveCoupon;$('filter').onchange=render;let d=new Date();$('date').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;live();
</script></body></html>
