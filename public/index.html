<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinScope Live</title><style>
:root{--bg:#04191e;--p:#08272d;--p2:#0c343b;--line:#15505a;--t:#f1fbfc;--m:#9bb9bf;--pink:#ff2f63;--green:#42e6a0;--amber:#ffd04a;--gray:#7f9da3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#031419,#073038 65%,#04191e);color:var(--t);font:14px system-ui,sans-serif}header{padding:16px;max-width:1050px;margin:auto;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-weight:950;letter-spacing:.08em;font-size:25px}.logo span{font-size:13px;color:var(--pink);margin-left:4px;font-weight:700}.small,.sub{color:var(--m);font-size:12px;line-height:1.45}main{max-width:1050px;margin:auto;padding:12px}.toolbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}button{cursor:pointer}.primary,.active{background:var(--pink);border-color:var(--pink);font-weight:800}.panel,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--p),#062126);padding:13px;margin:12px 0}.head{display:flex;justify-content:space-between;color:var(--m);font-size:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:17px 0}.team{font-weight:850;font-size:17px;overflow-wrap:anywhere}.team:last-child{text-align:right}.score{font-weight:950;font-size:26px;white-space:nowrap}.meta{text-align:center;color:var(--m);font-size:11px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#062126;border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0}.tabs button{border:0;background:transparent}.tabs button.active{background:var(--pink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.analysis-section{display:block;width:100%}.table{width:100%;border-spacing:0 5px}.table td{background:#06242a;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px;color:var(--m)}.table td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0;font-weight:800}.group{border:1px solid var(--line);border-radius:11px;padding:8px}.gt{font-size:12px;font-weight:850;margin:4px 3px 8px}.bar{display:grid;grid-template-columns:75px 1fr 40px;gap:7px;align-items:center;font-size:12px;padding:5px 0}.track{height:11px;border-radius:20px;background:#193d44;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:20px}.fill.amber{background:var(--amber)}.fill.gray{background:var(--gray)}.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.odd{border:1px solid var(--line);background:#0a3037;border-radius:11px;padding:9px;text-align:center;overflow-wrap:anywhere}.odd label{display:block;color:var(--m);font-size:11px}.odd strong{display:block;font-size:18px}.hidden{display:none!important}.empty{padding:18px;text-align:center;color:var(--m)}.err{color:#ff9baa}.statteam{padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.statline{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #123a41}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr;gap:6px}.statteam{padding:7px}.statline{gap:6px;font-size:12px}.group{padding:6px}.bar{grid-template-columns:48px minmax(20px,1fr) 31px;gap:4px;font-size:10px;padding:4px 0}.track{height:8px}.odds{grid-template-columns:repeat(2,minmax(0,1fr))}.team{font-size:14px}.score{font-size:23px}}
#matchSearch{flex:0 1 220px!important;min-width:120px!important;max-width:260px}#searchMatch,#clearMatchSearch{padding:8px 10px;font-size:12px}@media(max-width:650px){#matchSearchPanel .toolbar{gap:6px}#matchSearch{max-width:none;flex:1 1 150px!important}}
.grid>*{min-width:0}.group{min-width:0;overflow:hidden}.bar{min-width:0}.bar span{overflow-wrap:anywhere}.hidden{display:none!important}.archive-list{display:grid;gap:9px}.archive-item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#06242a}.archive-item .title{font-weight:850;margin-bottom:7px}.archive-item .rowline{display:flex;justify-content:space-between;gap:8px;padding:4px 0}.archive-item .rowline span{color:var(--m)}.archive-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.archive-actions button{padding:7px 10px}</style></head><body><header><div><div class="logo">WINSCOPE <span>LIVE</span></div><div class="sub">Canlı futbol analiz ve alarm sistemi</div></div><div class="small" id="conn">BAĞLANIYOR</div></header><main><div class="toolbar"><button class="primary" id="refresh">↻ Canlı maçlar</button><input id="date" type="date"><button id="bulletin">Bülten</button><button id="showAnalyses">Günün Analizleri</button><button id="showCoupons">Günün Kuponları</button><select id="filter"><option value="all">Tüm maçlar</option><option value="live">Canlı</option></select></div><section class="panel" id="matchSearchPanel"><h3 style="margin:2px 0 8px">🔎 1’e 1 MAÇ ARA</h3><div class="toolbar" style="margin:0"><input id="matchSearch" type="search" placeholder="Takım adı: Fenerbahçe, Barcelona…" style="flex:1;min-width:180px"><button id="searchMatch" class="primary">Maç Ara</button><button id="clearMatchSearch">Temizle</button></div><div id="matchSearchResult" class="small" style="margin-top:8px">Aramak için takım adını yaz.</div></section><section class="panel" id="couponPanel"><h3 style="margin:2px 0 10px">🎯 GÜNÜN KUPONU & CANLI KOMBİN</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="makeCoupon" class="primary">Maç Önü Taslak</button><button id="makeLiveCoupon" style="background:#42e6a0;color:#04191e;font-weight:900;border:none">⚡ Canlı Kombin Oluştur</button></div><div id="couponResult" class="small" style="margin-top:12px"></div></section><section class="panel hidden" id="analysesArchive"><div class="head"><h3>📋 Günün Analizleri</h3><button onclick="closeArchives()">Kapat</button></div><div id="analysesArchiveList" class="archive-list">Yükleniyor…</div></section><section class="panel hidden" id="couponsArchive"><div class="head"><h3>🎟️ Günün Kuponları</h3><button onclick="closeArchives()">Kapat</button></div><div id="couponsArchiveList" class="archive-list">Yükleniyor…</div></section><div id="msg" class="small"></div><section id="matches"><div class="empty">Maçlar yükleniyor…</div></section></main><script>
const $=x=>document.getElementById(x);let matches=[],bulletinMatches=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function bar(label,v,cls=''){if(v==null||!Number.isFinite(Number(v)))return `<div class="bar"><span>${esc(label)}</span><div class="track"></div><b>—</b></div>`;v=Math.max(0,Math.min(100,Number(v)));return `<div class="bar"><span>${esc(label)}</span><div class="track"><div class="fill ${cls}" style="width:${v}%"></div></div><b>${v.toFixed(1)}%</b></div>`}
function card(m){return `<article class="card" id="m${Number(m.id)}"><div class="head"><span>${esc(m.country||'')} · ${esc(m.league||'')}</span><span>${esc(m.status==='NS'?'BAŞLAMADI':(m.status==='FT'?'MAÇ BİTTİ':m.status||''))}${m.minute!=null&&!['NS','FT'].includes(m.status)?' · '+esc(m.minute)+"'":''}</span></div><div class="teams"><div class="team">${esc(m.home)}</div><div class="score">${esc(m.homeScore??'–')} : ${esc(m.awayScore??'–')}</div><div class="team">${esc(m.away)}</div></div><div class="meta">${m.fixtureDate?new Date(m.fixtureDate).toLocaleString('tr-TR'):''} · İddaa Kod: ${esc(m.iddaaCode||m.id)}</div><div class="tabs"><button class="active" onclick="analyze(${Number(m.id)},'${m.status==='NS'?'prematch':'live'}')">MAÇ ANALİZİ</button><button onclick="stats(${Number(m.id)})">İSTATİSTİK</button></div><div id="a${Number(m.id)}"><div class="empty">Maç analizi için dokun.</div></div><div id="s${Number(m.id)}" class="hidden"></div></article>`}function render(){let a=$('filter').value==='live'?matches.filter(m=>!['FT','AET','PEN','NS'].includes(m.status)):matches;$('matches').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Bu listede maç bulunamadı.</div>'}async function live(){ $('matches').innerHTML='<div class="empty">Canlı maçlar yükleniyor…</div>';try{let r=await fetch('/api/live'),j=await r.json();if(!r.ok)throw Error(j.detail||j.error);matches=j.matches||[];$('conn').textContent='SUNUCU BAĞLI';$('msg').textContent=`${matches.length} maç · ${new Date(j.fetchedAt||Date.now()).toLocaleTimeString('tr-TR')}`;render()}catch(e){$('conn').textContent='HATA';$('msg').innerHTML=`<span class="err">${esc(e.message)}</span>`;$('matches').innerHTML='<div class="empty">Maçlar alınamadı.</div>'}}async function bulletin(){let d=$('date').value;if(!d)return;try{let r=await fetch('/api/fixtures?date='+encodeURIComponent(d)),j=await r.json();if(!r.ok)throw Error(j.detail||j.error);bulletinMatches=j.matches||[];$('matches').innerHTML=bulletinMatches.length?bulletinMatches.map(card).join(''):'<div class="empty">Maç bulunamadı.</div>';$('msg').textContent=`${bulletinMatches.length} maç · ${d}`}catch(e){$('msg').innerHTML=`<span class="err">${esc(e.message)}</span>`}}async function searchMatch(){const q=$('matchSearch').value.trim().toLocaleLowerCase('tr-TR');const out=$('matchSearchResult');if(!q){out.innerHTML='<span class="err">Önce bir takım adı yaz kral.</span>';return}const d=$('date').value;if(!d){out.innerHTML='<span class="err">Önce tarih seç.</span>';return}out.textContent='Bültendeki maçlar aranıyor…';$('searchMatch').disabled=true;try{let source=bulletinMatches;if(!source.length||!source.some(m=>String(m.fixtureDate||'').slice(0,10)===d)){const r=await fetch('/api/fixtures?date='+encodeURIComponent(d),{signal:AbortSignal.timeout(20000)});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||'Bülten alınamadı');source=j.matches||[];bulletinMatches=source}const found=source.filter(m=>`${m.home||''} ${m.away||''}`.toLocaleLowerCase('tr-TR').includes(q));if(!found.length){out.textContent=`“${$('matchSearch').value.trim()}” için ${d} bülteninde maç bulunamadı.`;return}matches=source;$('filter').value='all';$('matches').innerHTML=found.map(card).join('');out.textContent=`${found.length} eşleşen maç bulundu · ${d}. Analiz veya istatistik için maça dokun.`;$('msg').textContent=`Arama sonucu: ${found.length} maç · ${d}`;$('matches').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){out.innerHTML=`<span class="err">Arama başarısız: ${esc(e.message)}</span>`}finally{$('searchMatch').disabled=false}}function clearMatchSearch(){$('matchSearch').value='';$('matchSearchResult').textContent='Aramak için takım adını yaz.';bulletinMatches=[]}
function hist(h){if(!h?.available)return '<div class="empty">Tarihsel örneklem bulunamadı; oran eşleşmesi yoksa son tamamlanmış geçmiş maçlardan sıklık gösterilir.</div>';let r=h.resultDistribution||{};let fs=Array.isArray(h.topFullTimeScores)?h.topFullTimeScores:[];let hs=Array.isArray(h.topHalfTimeScores)?h.topHalfTimeScores:[];const scoreText=a=>a.length?a.map(x=>`${esc(x[0])} (%${esc(x[1])})`).join(' · '):'Yeterli skor örneklemi yok';return `<div class="grid"><div class="group"><div class="gt">MAÇ SONU</div>${bar('MS 1',r['MS 1']?.percent)}${bar('MS X',r['MS X']?.percent,'amber')}${bar('MS 2',r['MS 2']?.percent,'gray')}${bar('MS 0.5 Üst',h.over05Percent)}${bar('MS 1.5 Üst',h.over15Percent)}${bar('MS 2.5 Üst',h.over25Percent)}${bar('MS 3.5 Üst',h.over35Percent)}${bar('KG Var',h.bttsPercent,'amber')}${bar('Ev 0.5+',h.home05Percent)}${bar('Dep 0.5+',h.away05Percent)}${bar('Ev 1.5+',h.home15Percent)}${bar('Dep 1.5+',h.away15Percent)}</div><div class="group"><div class="gt">İLK YARI</div>${bar('İY 0-0',h.ht00Percent,'gray')}${bar('İY 0.5 Üst',h.ht05Percent)}${bar('İY 1.5 Üst',h.ht15Percent)}${bar('İY 2.5 Üst',h.ht25Percent)}${bar('İY Ev 0.5+',h.htHome05Percent)}${bar('İY Dep 0.5+',h.htAway05Percent)}<div class="gt" style="margin-top:10px">EN SIK İY SKORLARI</div><div class="small">${scoreText(hs)}</div><div class="gt" style="margin-top:10px">EN SIK MS SKORLARI</div><div class="small">${scoreText(fs)}</div></div></div><div class="small"><b>Geçmiş örneklem:</b> ${esc(h.sampleSize)} maç · ${esc(h.sampleBasis==='recent-historical-fallback'?'Oran eşleşmesi yok: son tamamlanmış maçlar (karşılaştırma örneklemi)':'Oranlara en yakın geçmiş maçlar')}. Yüzdeler gerçekleşme sıklığıdır, garanti değildir.</div>`}
async function analyze(id,mode){let box=$('a'+id);box.innerHTML='<div class="empty">Gerçek oranlar, canlı istatistikler ve geçmiş skor dağılımı inceleniyor…</div>';try{let r=await fetch(`/api/match/${id}/analyze?mode=${mode}`),j=await r.json();if(!r.ok)throw Error(j.detail||j.error);const reasons=Array.isArray(j.reasons)?j.reasons:[];box.innerHTML=`<section class="panel" style="margin:8px 0"><div class="gt">1. MAÇ ANALİZİ</div><table class="table"><tr><td>İDDAA KOD</td><td><b>${esc(j.iddaaCode||id)}</b></td></tr><tr><td>ANA TERCİH</td><td>${esc(j.mainPick||'Analiz sinyali hesaplandı')}</td></tr><tr><td>ALTERNATİF</td><td>${esc(j.alternative||'—')}</td></tr><tr><td>SÜRPRİZ</td><td>${esc(j.surprise||'—')}</td></tr><tr><td>PİYASA YÖNÜ</td><td>${esc(j.marketDirection||'Oran hareketi ölçüm bekliyor')}</td></tr></table><div class="small" style="margin-top:8px"><b>Veri gerekçesi:</b> ${esc(reasons.join(' · ')||'Gerçek oranlar ve geçmiş skor dağılımı üzerinden hesaplandı.')}</div></section><section class="panel" style="margin:8px 0"><div class="gt">2. EN OLASI SKORLAR</div><table class="table"><tr><td>İY SKOR</td><td><b>${esc(j.halfTimeScore||'—')}</b></td></tr><tr><td>MS SKOR</td><td><b>${esc(j.fullTimeScore||'—')}</b></td></tr></table><div class="small">Skorlar geçmiş tamamlanmış maçlardaki gerçek İY/MS skor dağılımından seçilir; canlı maçta mevcut skorun gerisinde kalan skorlar elenir. Yüzdeler geçmiş gerçekleşme sıklığıdır, garanti değildir.</div></section><div class="toolbar"><button class="primary" onclick="approveAnalysis(${id},'${mode}')">Analizi Onayla ve Kaydet</button></div>`}catch(e){box.innerHTML=`<div class="small err">${esc(e.message)}</div>`}}
async function stats(id){let b=$('s'+id);b.classList.remove('hidden');b.innerHTML='<div class="empty">İstatistik yükleniyor…</div>';try{let r=await fetch(`/api/match/${id}/stats`),j=await r.json();if(!r.ok)throw Error(j.error||'İstatistik alınamadı');let list=j.stats||[];if(!list.length){b.innerHTML='<div class="panel">İstatistik verisi bulunamadı.</div>';return;}b.innerHTML=`<div class="panel"><h3>İSTATİSTİK</h3>${list.map(t=>{let name=t.team?.name||t.team||'Takım';let stList=Array.isArray(t.statistics)?t.statistics:(typeof t.statistics==='object'?Object.entries(t.statistics).map(([type,value])=>({type,value})):[]);return `<div class="statteam"><b>${esc(name)}</b>${stList.map(s=>`<div class="statline"><span>${esc(s.type||'')}</span><b>${esc(s.value??'-')}</b></div>`).join('')}</div>`}).join('')}</div>`}catch(e){b.innerHTML=`<div class="small err">${esc(e.message)}</div>`}}
function renderCoupon(d){
 const box=$('couponResult');
 if(d.status==='NO_MATCHES'||!d.picks||!d.picks.length){
  const rows=Array.isArray(d.analysisRows)?d.analysisRows:[];
  const cards=rows.map(p=>`<div class="statteam"><div class="head"><span>${esc(p.league||'')} · Kod: ${esc(p.iddaaCode||p.fixtureId||'-')}</span><span>${esc(p.minute??'—')}' · ${esc(p.currentScore||'—')}</span></div><div style="font-weight:850;margin:8px 0">${esc(p.home)} VS ${esc(p.away)}</div><div class="statline"><span>Analiz sonucu</span><b>${esc(p.market||'ANALİZ: NET TERCİH YOK')}</b></div><div class="statline"><span>Alternatif</span><b>${esc(p.alternative||'—')}</b></div><div class="statline"><span>Benzer geçmiş maç</span><b>${esc(p.sampleSize)} maç</b></div><div class="statline"><span>Oran hareketi</span><b>${esc(p.marketDirection||'Ölçülmedi')}</b></div><div class="statline"><span>Canlı veri</span><b>${p.hasLiveStats?'İstatistik var':'İstatistik eksik'} · ${p.hasLiveOdds?'Canlı oran var':'Canlı oran eksik'}</b></div><div class="group"><div class="gt">GEÇMİŞ BENZER MAÇLARIN PAZAR YÜZDELERİ</div>${bar('İY 0-0',p.markets?.ht00,'gray')}${bar('İY 0.5 Üst',p.markets?.ht05)}${bar('İY 1.5 Üst',p.markets?.ht15)}${bar('İY 2.5 Üst',p.markets?.ht25)}${bar('İY Ev 0.5+',p.markets?.htHome05)}${bar('İY Dep 0.5+',p.markets?.htAway05)}${bar('MS 0.5 Üst',p.markets?.ft05)}${bar('MS 1.5 Üst',p.markets?.ft15)}${bar('MS 2.5 Üst',p.markets?.ft25)}${bar('MS 3.5 Üst',p.markets?.ft35)}${bar('Ev 0.5+',p.markets?.home05)}${bar('Dep 0.5+',p.markets?.away05)}${bar('KG Var',p.markets?.btts,'amber')}${bar('MS 1',p.markets?.ms1)}${bar('MS X',p.markets?.msx,'amber')}${bar('MS 2',p.markets?.ms2,'gray')}<div class="small">En sık İY skorları: ${esc((p.topHalfTimeScores||[]).map(x=>`${x[0]} %${x[1]}`).join(' · ')||'—')}<br>En sık MS skorları: ${esc((p.topFullTimeScores||[]).map(x=>`${x[0]} %${x[1]}`).join(' · ')||'—')}</div></div><div class="small">${esc(p.rationale||'Gerekçe yok')}</div></div>`).join('');
  box.innerHTML=`<div class="err"><b>${rows.length?'Analiz tamamlandı; kupon eşiğini geçen aday yok.':'Analiz sonucu üretilemedi.'}</b></div><div class="small">${esc(d.note||'Veri yetersiz; otomatik kupon oluşturulmadı.')}</div>${cards?`<div style="margin-top:10px"><b>İNCELENEN CANLI MAÇLAR</b>${cards}</div>`:''}`;return;
 }
 const extraRows=Array.isArray(d.analysisRows)?d.analysisRows:[];
 const extraHtml=extraRows.length?`<div style="margin-top:14px"><b>İNCELEMEYE ALINAN DİĞER CANLI MAÇLAR</b>${extraRows.map(p=>`<div class="statteam"><div style="font-weight:850">${esc(p.home)} VS ${esc(p.away)} · ${esc(p.minute)}' · ${esc(p.currentScore)}</div><div class="statline"><span>Ana analiz</span><b>${esc(p.market||'—')}</b></div><div class="statline"><span>Alternatif</span><b>${esc(p.alternative||'—')}</b></div><div class="statline"><span>Geçmiş örneklem</span><b>${esc(p.sampleSize)} maç</b></div><div class="statline"><span>Oran yönü</span><b>${esc(p.marketDirection||'ölçüm bekleniyor')}</b></div><div class="group"><div class="gt">GEÇMİŞ PAZAR YÜZDELERİ</div>${bar('İY 0-0',p.markets?.ht00,'gray')}${bar('İY 0.5+',p.markets?.ht05)}${bar('İY Ev 0.5+',p.markets?.htHome05)}${bar('İY Dep 0.5+',p.markets?.htAway05)}${bar('MS 0.5+',p.markets?.ft05)}${bar('MS 1.5+',p.markets?.ft15)}${bar('MS 2.5+',p.markets?.ft25)}${bar('MS 3.5+',p.markets?.ft35)}${bar('Ev 0.5+',p.markets?.home05)}${bar('Dep 0.5+',p.markets?.away05)}${bar('KG Var',p.markets?.btts,'amber')}</div><div class="small">${esc(p.rationale||'')}</div></div>`).join('')}</div>`:'';
 box.innerHTML=`<div class="head"><span>${d.isLive?'🎯 CANLI KOMBİN':'MAÇ ÖNÜ KUPON'} · ${esc(d.date)}</span><span><b>ONAY BEKLİYOR</b></span></div><div class="small">${esc(d.note||'')}</div><div style="margin:10px 0">${d.picks.map((p,i)=>`<div class="statteam"><div class="head"><span>Kod: ${esc(p.iddaaCode||'-')} · ${esc(p.league)}</span><span>${p.minute?esc(p.minute)+"' · Skor: "+esc(p.currentScore||'0-0'):'Maç önü'}</span></div><div style="font-weight:850;margin:8px 0">${esc(p.home)} VS ${esc(p.away)}</div><div class="statline"><span>Tercih</span><b>${esc(p.market)}</b></div><div class="statline"><span>Geçmiş örneklem sıklığı</span><b>%${esc(p.historicalFrequency ?? p.historicalProbability ?? '—')}</b></div><div class="statline"><span>Oran yönü</span><b>${esc(p.oddsDirection||'ölçüm bekleniyor')}</b></div></div>`).join('')}</div><div class="toolbar"><button class="primary" id="approveCoupon">Kuponu Onayla ve Kaydet</button></div>${extraHtml}`;
 $('approveCoupon').onclick=()=>approveCoupon(d.draftId);
}
async function makeCoupon(){const b=$('makeCoupon');b.disabled=true;b.textContent='Oluşturuluyor…';try{let r=await fetch('/api/coupon/daily?date='+encodeURIComponent($('date').value));let d=await r.json();if(!r.ok)throw Error(d.error||'Hata');renderCoupon(d);}catch(e){$('couponResult').innerHTML=`<span class="err">${esc(e.message)}</span>`;}finally{b.disabled=false;b.textContent='Maç Önü Taslak';}}
async function makeLiveCoupon(){const b=$('makeLiveCoupon');b.disabled=true;b.textContent='Canlı Taranıyor…';try{let r=await fetch('/api/coupon/live');let d=await r.json();if(!r.ok)throw Error(d.error||'Hata');renderCoupon(d);}catch(e){$('couponResult').innerHTML=`<span class="err">${esc(e.message)}</span>`;}finally{b.disabled=false;b.textContent='⚡ Canlı Kombin';}}
async function approveCoupon(draftId){try{let r=await fetch('/api/coupon/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({draftId})});let d=await r.json();if(!r.ok)throw Error(d.error||'Hata');alert('Kupon onaylandı ve arşive kaydedildi.');}catch(e){alert('Onaylanamadı: '+e.message);}}
async function approveAnalysis(id,mode){
 const match=[...matches,...bulletinMatches].find(x=>Number(x.id)===Number(id));
 const box=$('a'+id);if(!match||!box)return;
 const vals={};box.querySelectorAll('.table tr').forEach(row=>{const c=row.querySelectorAll('td');if(c.length===2)vals[c[0].textContent.trim()]=c[1].textContent.trim()});
 const analysis={mainPick:vals['ANA TERCİH']||'—',alternative:vals['ALTERNATİF']||'—',halfTimeScore:vals['İY SKOR']||'—',fullTimeScore:vals['MS SKOR']||'—',surprise:vals['SÜRPRİZ']||'—',marketDirection:vals['PİYASA YÖNÜ']||'—',mode};
 try{let r=await fetch('/api/analyses/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fixtureId:Number(id),matchDate:match.fixtureDate||'',home:match.home,away:match.away,analysis})});let j=await r.json();if(!r.ok)throw Error(j.error||'Hata');alert('Analiz onaylandı ve arşive kaydedildi.');}catch(e){alert('Kaydedilemedi: '+e.message);}
}
function closeArchives(){$('analysesArchive').classList.add('hidden');$('couponsArchive').classList.add('hidden');}
async function loadArchives(which){
 const box=$(which==='analysis'?'analysesArchiveList':'couponsArchiveList');box.textContent='Yükleniyor…';
 try{let r=await fetch('/api/archives'),j=await r.json();if(!r.ok)throw Error(j.error||'Hata');
 if(which==='analysis'){box.innerHTML=(j.analyses||[]).length?j.analyses.map(x=>`<div class="archive-item"><div class="title">${esc(x.home_team)} VS ${esc(x.away_team)}</div><div class="small">${esc(x.match_date||'')}</div><div class="rowline"><span>Ana tercih</span><b>${esc(x.analysis?.mainPick||'—')}</b></div><div class="rowline"><span>İY / MS skor</span><b>${esc(x.analysis?.halfTimeScore||'—')} / ${esc(x.analysis?.fullTimeScore||'—')}</b></div><div class="archive-actions"><button onclick="deleteArchive('analysis',${Number(x.fixture_id||x.id)})">Sil</button></div></div>`).join(''):'<div class="empty">Kayıt yok.</div>';}
 else{box.innerHTML=(j.coupons||[]).length?j.coupons.map(x=>`<div class="archive-item"><div class="title">${x.isLive?'🎯 Canlı Kombin':'Kupon'} · ${esc(x.date||'')}</div>${(x.picks||[]).map(p=>`<div class="rowline"><span>${esc(p.home)} - ${esc(p.away)}</span><b>${esc(p.market)}</b></div>`).join('')}<div class="archive-actions"><button onclick="deleteArchive('coupon','${esc(x.draftId||x.id)}')">Sil</button></div></div>`).join(''):'<div class="empty">Kayıt yok.</div>';}
 }catch(e){box.innerHTML=`<div class="err">${esc(e.message)}` }
}
async function deleteArchive(type,id){if(!confirm('Silmek istiyor musun?'))return;try{await fetch(`/api/archives/${type}/${id}`,{method:'DELETE'});loadArchives(type==='analysis'?'analysis':'coupon');}catch(e){alert('Silinemedi');}}
window.analyze=analyze;window.stats=stats;$('refresh').onclick=live;$('bulletin').onclick=bulletin;$('searchMatch').onclick=searchMatch;$('matchSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchMatch()});$('clearMatchSearch').onclick=clearMatchSearch;$('makeCoupon').onclick=makeCoupon;$('makeLiveCoupon').onclick=makeLiveCoupon;$('showAnalyses').onclick=()=>{closeArchives();$('analysesArchive').classList.remove('hidden');loadArchives('analysis');};$('showCoupons').onclick=()=>{closeArchives();$('couponsArchive').classList.remove('hidden');loadArchives('coupon');};$('filter').onchange=render;let d=new Date();$('date').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;live();
</script></body></html>
