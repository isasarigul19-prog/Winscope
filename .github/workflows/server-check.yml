name: WinScope Server Syntax Check

on:
  push:
    branches:
      - test/winscope-improvements
    paths:
      - "server.js"
      - ".github/workflows/server-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check server syntax
        run: node --check server.js
      - name: Check package scripts
        run: npm pkg get scripts
