name: Node.js syntax check

on:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - ".github/workflows/node-check.yml"
  pull_request:
    paths:
      - "server.js"
      - "package.json"
      - ".github/workflows/node-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check server syntax
        run: node --check server.js
